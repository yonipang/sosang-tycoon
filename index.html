/* 소상공인 키우기 — 한 가지 테마: 골목 분식집의 따뜻한 종이·나무색.
   글꼴은 16px 격자 도트 글꼴이라 글자 크기는 16px·32px만 써요. */
:root {
  --ink: #3b2a20;
  --ink-soft: #7a5f4c;
  --paper: #fbf3e2;
  --paper-2: #f2e4c6;
  --line: #d9c39b;
  --wood: #2b1d16;
  --wood-2: #3d2a20;
  --red: #d8452f;
  --red-dark: #9e2c1d;
  --mustard: #f2b134;
  --green: #4f9a3a;
  --blue: #3c5aa6;
  --night: #1d2340;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--wood);
  color: var(--ink);
  font: 16px/1.5 'NeoDunggeunmo Pro', monospace;
  -webkit-font-smoothing: none;
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
img.px { object-fit: contain; }

#app {
  position: relative;
  max-width: 480px; height: 100dvh; margin: 0 auto;
  display: flex; flex-direction: column;
  background: var(--wood-2);
  overflow: hidden;
}

/* ── 위 막대 ── */
#hud { background: var(--paper); border-bottom: 4px solid var(--ink); padding: 8px 8px 6px; padding-top: max(8px, env(safe-area-inset-top)); }
.hud-row { display: flex; align-items: center; gap: 6px; }
.pill { background: var(--paper-2); border: 2px solid var(--ink); padding: 0 6px; white-space: nowrap; }
.pill.cash { margin-left: auto; }
.pill b { font-weight: normal; }
.pill.star { color: var(--red-dark); }
.clock { background: var(--ink); color: var(--paper); padding: 0 6px; letter-spacing: 1px; }
#tickets { display: flex; gap: 4px; margin-top: 6px; min-height: 48px; overflow: hidden; }
.tk { position: relative; width: 44px; height: 48px; flex: none; background: #fff; border: 2px solid var(--ink); }
.tk img { position: absolute; left: 8px; top: 4px; width: 24px; height: 24px; }
.tk b { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; line-height: 16px; font-weight: normal; color: var(--ink-soft); }
.tk i { position: absolute; left: 0; top: 0; height: 3px; background: var(--green); }
.tk.late i { background: var(--red); }
.tk.late { animation: shake .4s steps(2) infinite; }
.tk.ready { background: #e8f4d8; border-color: var(--green); }
.tk.more { color: var(--ink-soft); }
.tk-empty { color: var(--ink-soft); line-height: 48px; }
@keyframes shake { 50% { transform: translateX(1px); } }

/* ── 가게 ── */
#stage { flex: 1; min-height: 0; display: grid; place-items: center; background:
  repeating-linear-gradient(90deg, #35251c 0 32px, #3a281e 32px 64px); }
#cvWrap { position: relative; line-height: 0; box-shadow: 0 4px 0 var(--ink), 0 10px 0 rgba(0,0,0,.3); }
#cv { display: block; cursor: pointer; }
#floats { position: absolute; inset: 0; pointer-events: none; overflow: visible; line-height: 1.5; }
.float { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; color: #fff;
  text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink);
  animation: rise 1.2s steps(12) forwards; }
.float.cash { color: var(--mustard); }
.float.great { color: #ffe36e; }
.float.good { color: #c9f0a8; }
.float.bad { color: #ffb3a6; }
@keyframes rise { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; margin-top: 0; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -32px; } }

/* 조리 미니게임 */
#cookUI { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; line-height: 1.5; cursor: pointer; background: rgba(29,35,64,.15); }
.cook-card { width: 88%; background: var(--paper); border: 4px solid var(--ink); padding: 6px 10px 8px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.cook-name { text-align: center; }
.cook-bar { position: relative; height: 24px; margin: 4px 0; background: #e9d8b8; border: 2px solid var(--ink); }
.cook-bar i { position: absolute; top: 0; bottom: 0; }
#zoneGood { background: var(--mustard); }
#zonePerfect { background: var(--red); }
#cookFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--green); }
/* 말기: 여섯 칸을 채워요 · 바늘은 남은 시간 */
.g-roll { background: repeating-linear-gradient(90deg, #e9d8b8 0 calc(100% / 6 - 2px), var(--ink) calc(100% / 6 - 2px) calc(100% / 6)); }
.g-roll #cookFill { background: #3f8a3a; opacity: .85; }
.g-roll #cookNeedle { width: 2px; background: var(--red); box-shadow: none; }
/* 튀기기: 노릇해지는 색 · 구간은 테두리로 */
.g-fry { background: linear-gradient(90deg, #f7ecc4 0%, #f2d27a 45%, #e3a23c 68%, #b8641e 86%, #4a2a14 100%); }
.g-fry #zoneGood { background: none; border: 2px dashed var(--ink); top: -2px; bottom: -2px; }
.g-fry #zonePerfect { background: rgba(255,255,255,.35); border: 2px solid #fff; top: -2px; bottom: -2px; }
#cookNeedle { position: absolute; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; background: var(--ink); box-shadow: 0 0 0 2px #fff; }
.cook-tip { text-align: center; color: var(--ink-soft); }

/* ── 아래 막대 ── */
#bar { display: flex; align-items: center; gap: 8px; background: var(--paper); border-top: 4px solid var(--ink); padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
.hands-wrap { display: flex; align-items: center; gap: 4px; }
.hands-wrap small { color: var(--ink-soft); font-size: 16px; }
#hands { display: flex; gap: 4px; }
.hand { width: 40px; height: 40px; background: var(--paper-2); border: 2px dashed var(--line); display: grid; place-items: center; }
.hand img { transform: scale(2); }
.hand.q0, .hand.q1, .hand.q2 { border-style: solid; border-color: var(--ink); background: #fff; }
.hand.q2 { border-color: var(--red); box-shadow: inset 0 0 0 2px #ffe36e; }
#stockMini { display: flex; gap: 6px; flex: 1; justify-content: center; }
#stockMini span { display: flex; align-items: center; gap: 2px; }
#stockMini span.low { color: var(--red); }
#stockMini span.out { color: var(--red-dark); text-decoration: line-through; }
.ctl { display: flex; gap: 4px; }
.sq { width: 40px; height: 40px; padding: 0; background: var(--paper-2); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
.sq:active { transform: translateY(3px); box-shadow: none; }

/* 영업 밖에는 위아래 막대를 숨겨요 */
body:not([data-phase="day"]) #hud .hud-row .clock,
body:not([data-phase="day"]) #tickets,
body:not([data-phase="day"]) #bar { visibility: hidden; }
body[data-phase="title"] #hud { visibility: hidden; }

/* ── 알림 ── */
#toasts { position: absolute; left: 8px; right: 8px; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 20; }
.toast { background: var(--ink); color: var(--paper); padding: 4px 10px; border: 2px solid var(--paper); max-width: 100%; text-align: center; transition: opacity .3s; }
.toast.warn { background: var(--red-dark); }
.toast.good { background: var(--green); }
.toast.hint { background: var(--blue); }
.toast.out { opacity: 0; }

/* ── 화면 (처음·준비·영수증·주간) ── */
#screen { position: absolute; inset: 0; overflow-y: auto; z-index: 10; padding: 16px 14px 24px; background: rgba(29,35,64,.55); }
#screen.scr-prep, #screen.scr-receipt, #screen.scr-weekly, #screen.scr-pause { top: 60px; }
#screen > div { max-width: 420px; margin: 0 auto; }
h1, h2 { font-weight: normal; margin: 0; }
h2 { font-size: 32px; line-height: 1.25; color: var(--paper); text-shadow: 0 3px 0 var(--ink); margin-bottom: 8px; }

.btn { display: block; width: 100%; margin: 10px 0 0; min-height: 48px; padding: 8px 12px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.primary { background: var(--red); color: #fff; text-shadow: 0 2px 0 var(--red-dark); }
.btn.big { min-height: 56px; }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--paper); box-shadow: none; }
.btn.small { min-height: 40px; }

/* 처음 화면 */
#screen.scr-title { background: linear-gradient(180deg, #1d2340 0%, #3d2a20 70%); display: flex; align-items: center; }
.title { text-align: center; color: var(--paper); width: 100%; }
.logo-sub { color: var(--mustard); }
.logo { font-size: 32px; line-height: 1.2; color: #fff; text-shadow: 0 4px 0 var(--red-dark), 0 6px 0 var(--ink); margin: 4px 0 12px; letter-spacing: 2px; }
.hero { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin: 8px 0 16px; }
.hero .big { width: 48px; height: 96px; }
.hero .dish { width: 32px; height: 32px; }
.namebox { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.namebox label { white-space: nowrap; }
.namebox input { color: var(--ink); flex: 1; min-width: 0; background: var(--paper); border: 3px solid var(--ink); padding: 6px 8px; user-select: text; -webkit-user-select: text; }
.howto { color: var(--paper-2); margin: 16px 0 4px; }
.proto { color: var(--mustard); margin: 4px 0; }

/* 새벽 준비 */
#screen.scr-prep { background: linear-gradient(180deg, rgba(29,35,64,.92), rgba(43,29,22,.92)); }
.phase-tag { display: inline-block; padding: 0 8px; margin-bottom: 4px; border: 2px solid var(--paper); color: var(--paper); }
.phase-tag.night { background: var(--night); }
.yday { color: var(--paper-2); margin: 0 0 10px; }
.yday b { color: var(--mustard); font-weight: normal; }
.mcard { background: var(--paper); border: 3px solid var(--ink); padding: 8px 10px; margin-bottom: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.mhead { display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
.mhead .tags { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.tag { border: 2px solid var(--line); padding: 0 6px; color: var(--ink-soft); white-space: nowrap; }
.tag.new { background: var(--red); border-color: var(--red); color: #fff; }
.tag.hot { border-color: var(--mustard); color: #a06a10; }
.tag.warn { border-color: var(--red); color: var(--red); }
.more { margin-top: 4px; color: var(--ink-soft); }
.more summary { cursor: pointer; list-style: none; text-align: right; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: ' ▾'; }
.more[open] summary::after { content: ' ▴'; }
.more p { margin: 4px 0 0; }
.mhead .dish { width: 32px; height: 32px; flex: none; }
.mhead b { font-weight: normal; display: block; }
.mhead small, .mhead em { display: block; font-size: 16px; color: var(--ink-soft); font-style: normal; }
.mhead em.out { color: var(--red); }
.row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.step { display: flex; align-items: center; gap: 6px; }
.step b { font-weight: normal; min-width: 72px; text-align: center; }
.step button { width: 40px; height: 36px; padding: 0; background: var(--paper-2); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
.step button:active { transform: translateY(3px); box-shadow: none; }
.sum { background: var(--paper-2); border: 3px solid var(--ink); padding: 6px 10px; }
.sum > div { display: flex; justify-content: space-between; gap: 8px; }
.sum b { font-weight: normal; text-align: right; }
.sum .due { color: var(--red-dark); }
.sum .due.soft { color: var(--ink-soft); }
.neg { color: var(--red); }

/* 영수증 */
#screen.scr-receipt, #screen.scr-weekly { background: linear-gradient(180deg, rgba(29,35,64,.9), rgba(29,35,64,.75)); }
.paper { background: #fffdf6; padding: 12px 14px 16px; position: relative; box-shadow: 0 6px 0 rgba(0,0,0,.3);
  -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/16px 8px repeat-x;
          mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/16px 8px repeat-x; }
.rc-head { text-align: center; }
.rc-head b { display: block; font-size: 32px; line-height: 1.25; font-weight: normal; }
.rc-head small { font-size: 16px; color: var(--ink-soft); }
.dash { border-top: 2px dashed var(--line); margin: 8px 0; }
.ln { display: flex; justify-content: space-between; gap: 8px; }
.ln b { font-weight: normal; white-space: nowrap; }
.ln.minus b { color: var(--ink-soft); }
.ln.total { background: var(--paper-2); margin: 4px -6px; padding: 2px 6px; }
.ln.note { color: var(--ink-soft); }
.ln.star b { color: var(--red-dark); }
.up { color: var(--green); font-size: 16px; }
.down { color: var(--red); font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { border: 2px solid var(--line); padding: 0 6px; color: var(--ink-soft); }
.rvs { margin-top: 6px; }
.rv { border-left: 4px solid var(--mustard); padding: 2px 8px; margin-top: 6px; background: var(--paper); }
.rv p { margin: 0; }
.rs { color: var(--mustard); display: flex; justify-content: space-between; }
.rs small { color: var(--ink-soft); font-size: 16px; }
.rc-foot { text-align: center; color: var(--ink-soft); margin-top: 10px; }
.warn { color: #ffd2c8; }

/* 쉬기 */
#screen.scr-pause { display: flex; align-items: center; }
.pause { width: 100%; text-align: center; }

/* 새 메뉴 표시 */
.new { display: inline-block; background: var(--red); color: #fff; padding: 0 6px; margin-left: 4px; }

/* 지나가는 사람의 한마디 */
.say { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; background: #fffaf0; color: var(--ink);
  border: 2px solid var(--ink); padding: 0 6px; line-height: 1.4; pointer-events: none; }
.say::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -3px; border: 3px solid transparent; border-top-color: var(--ink); }

  for (const k in obj) sum += Math.max(0, obj[k]);

}

function solidForPlayer(x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return true;
  if (y <= 2 || y >= FRONT_Y) return true;
  if (TABLES.some(t => onTable(t, x, y))) return true;
  if (SEATS.some(s => s.x === x && s.y === y)) return true;
  if (REGISTER.tiles.some(([a, b]) => a === x && b === y)) return true;
  if (Object.values(DECOR).some(d => d.x === x && d.y === y)) return true;
  return false;
}
// 손님이 못 가는 칸 (자리는 자기 자리만 — sim/path.js에서 따로 허락)
function solidForCustomer(x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return true;
  if (y === WALK_Y) return false;
  if (y === FRONT_Y) return x !== DOOR.x;
  return solidForPlayer(x, y);
}

//  kind 상권 유형 · competition 경쟁 강도(같은 업종 가게 수) · demand 이 상권에서 메뉴마다 찾는 정도(0~1)
const DISTRICT_KINDS = {

  academy: { name: '주거 · 학원가', demand: { tteok: 1.0, twigim: 0.9, kimbap: 0.7 } },
  office: { name: '오피스', demand: { kimbap: 1.0, tteok: 0.7, twigim: 0.5 } },
  commercial: { name: '상업', demand: { tteok: 0.9, twigim: 0.9, kimbap: 0.8 } },

// 경쟁 강도: 같은 업종이 많을수록 들어오는 손님이 줄어요 (3장 길 건너 프랜차이즈가 생기면 「높음」)
const COMPETITION = {
  low: { name: '낮음', mul: 1.1 },
  normal: { name: '보통', mul: 1.0 },
  high: { name: '높음', mul: 0.85 },

function menuFit(openMenus) {
  const d = DISTRICT_KINDS[DISTRICT.kind].demand;
  const all = Object.values(d).reduce((a, b) => a + b, 0);
  const fit = openMenus.reduce((s, m) => s + (d[m] || 0), 0) / all;
  return 0.85 + 0.15 * Math.min(1, fit);
}

// ── js/save/migrations.js ──
// 옛 세이브 보정은 모두 여기에 둬요. 세이브 구조를 바꾸면 기본값을 채우는 줄을 아래에 더해요.

function migrate(o) {
  if (!o || typeof o !== 'object') throw new Error('세이브 형식이 아니에요');
  if (!o.stats) o.stats = { served: 0, sales: 0 };
  if (!Array.isArray(o.history)) o.history = [];
  if (!o.ledger) o.ledger = { tteok: {}, kimbap: {}, twigim: {} }; // 가격 장부 이전 세이브
  if (!o.inv) o.inv = { tteok: [], kimbap: [], twigim: [] }; // 재료 이월(유통기한) 이전 세이브
  if (!o.story) { // 이야기 이전 세이브: 날짜로 열렸던 메뉴는 그대로, 4일차 이후면 1장부터
    const st = newStory(), d = o.day || 1;
    st.menus = ['tteok', 'kimbap', 'twigim'].filter((m, i) => d >= i + 1);
    st.queue = [];
    if (d >= 4) {
      Object.assign(st, { ch: 1, title: '사장 지망생', active: ['c1_first', 'c1_stock'], done: ['p_stir', 'p_serve', 'p_book', 'p_keys', 'c1_note', 'c1_kimbap', 'c1_fryer'] });
    } else { st.active = ['p_stir', 'p_serve', 'p_book', 'p_keys']; st.prog = { p_keys: d - 1 }; st.title = '알바생'; }
    o.story = st;
  }
  if (!o.story.tools) { o.story.tools = []; o.story.toolsOpen = o.story.ch >= 2 || o.story.done.includes('c1_kimbap'); } // 장사 도구 이전 세이브
  return o;
}
// ── js/save/state.js ──
// 게임 상태 G: 저장되는 것(G.*)과 하루 영업 중에만 쓰는 것(G.run)으로 나뉘어요.
// 세이브 호환: 저장 키·버전은 바꾸지 않아요. 새 칸은 기본값과 함께 추가만 하고, 옛 세이브 보정은 save/migrations.js에.

const SAVE_KEY = 'sosang-tycoon-save-v1';
const SAVE_V = 1;
// 저장하는 칸 (순서대로 직렬화)
// story = 이야기 진행 (data/story.js newStory)
// prep = 오늘 아침 도착할 재료 주문량(인분) · inv = 가게 재료 { 메뉴: [{ n: 인분, exp: 이 날까지 쓸 수 있음 }] }
const SAVE_ORDER = ['v', 'shop', 'day', 'cash', 'loan', 'rating', 'ratingN', 'prices', 'prep', 'inv', 'ledger', 'history', 'weekSales', 'baseSeed', 'stats', 'story'];

const G = { phase: 'title', run: null };

function newGame(shopName) {
  Object.assign(G, {
    v: SAVE_V,
    shop: shopName || '오가네 분식', // 프롤로그는 오 사장님 가게. 인수할 때 이름을 지어요
    day: 1,
    cash: START_CASH,
    loan: START_LOAN,
    rating: 3.0,
    ratingN: 0,
    prices: Object.fromEntries(MENU_IDS.map(m => [m, MENUS[m].price])),
    prep: { ...PREP_FIRST_DAY },
    inv: Object.fromEntries(MENU_IDS.map(m => [m, []])),
    ledger: Object.fromEntries(MENU_IDS.map(m => [m, {}])), // 가격 장부 { 메뉴: { 가격: { love, happy, meh, angry } } }
    history: [],
    weekSales: 0,
    baseSeed: 0,
    stats: { served: 0, sales: 0 },
    story: newStory(),
    phase: 'prep',
    run: null,
  });
}

function serialize() {
  const o = {};
  for (const k of SAVE_ORDER) o[k] = G[k];
  return JSON.stringify(o);
}

function deserialize(text) {
  const o = migrate(JSON.parse(text));
  newGame(o.shop);
  for (const k of SAVE_ORDER) if (o[k] !== undefined) G[k] = o[k];
  G.v = SAVE_V;
  G.phase = 'prep'; // 영업 중에 껐다면 그날 아침 준비부터 다시 해요
  G.run = null;
}
// ── js/save/storage.js ──
// 브라우저 저장 (localStorage는 막혀 있을 수 있어서 모두 try/catch)

function saveGame() {
  try { localStorage.setItem(SAVE_KEY, serialize()); return true; } catch (e) { return false; }
}
function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}
function loadGame() {
  try {
    const t = localStorage.getItem(SAVE_KEY);
    if (!t) return false;
    deserialize(t);
    return true;
  } catch (e) { return false; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 저장소를 못 쓰는 환경 */ }
}
// ── js/sim/story.js ──
// 이야기 규칙: 퀘스트 세기·끝내기, 장면 차례, 메뉴 열기. 화면은 만지지 않고 사건만 남겨요.
//  emit('story') = 보여 줄 장면이 생겼어요 (ui/story.js가 차례대로 보여 줘요)

// 메뉴가 열렸는지 (조리대·주문·손님 메뉴가 모두 이걸 봐요)
const menuOpen = m => G.story ? G.story.menus.includes(m) : m === 'tteok';
const questActive = id => !!G.story && G.story.active.includes(id);
const isDone = id => G.story.done.includes(id);
// 진행도 (화면용): [지금, 목표]
const questProg = id => [Math.min(QUESTS[id].need, G.story.prog[id] || 0), QUESTS[id].need];
// 진행도는 다 찼는데 다른 퀘스트를 기다리는 중인지
const questWaiting = id => (G.story.prog[id] || 0) >= QUESTS[id].need && !(QUESTS[id].after || []).every(isDone);

function start(id) {
  const S = G.story;
  if (isDone(id) || S.active.includes(id)) return;
  S.active.push(id);
  S.prog[id] = S.prog[id] || 0;
}

function openMenu(m, now) {
  const S = G.story;
  if (S.menus.includes(m) || S.soon.includes(m)) return;
  if (!now) { S.soon.push(m); return; }
  S.menus.push(m); S.fresh.push(m);
  G.prep[m] = PREP_FIRST_DAY[m];
}

function queueScene(id) {
  const sc = SCENES[id];
  // 조건에 따라 다른 장면 (예: 별점이 3.5 이상이면 좋은 기사)
  if (sc.alt && sc.alt.cond === 'rating35' && G.rating < 3.5) id = sc.alt.else;
  G.story.queue.push(id);
}

function complete(id) {
  const S = G.story, q = QUESTS[id];
  S.active = S.active.filter(x => x !== id);
  S.done.push(id); S.today.push(id);
  emit('toast', `퀘스트 완료 · ${q.title}`, 'quest');
  emit('sfx', 'perfect');
  const g = q.give || {};
  if (g.menuNext) openMenu(g.menuNext, false);
  if (g.menuNow) openMenu(g.menuNow, true);
  for (const s of g.scenes || []) queueScene(s);
  // 기다리던 퀘스트 시작 · 기다리던 완료
  for (const qid in QUESTS) if (QUESTS[qid].needs && QUESTS[qid].needs.every(isDone)) start(qid);
  for (const qid of S.active.slice()) if (canFinish(qid)) complete(qid);
  if (g.scenes) emit('story');
  emit('quest');
}
const canFinish = id => (G.story.prog[id] || 0) >= QUESTS[id].need && (QUESTS[id].after || []).every(isDone);

// 규칙 코드가 「이런 일이 있었다」고 알려 주면 맞는 퀘스트를 세요
//  d: { menu, q(조리 결과), n(사람 수), served(그날 받은 손님), clean(재료가 안 떨어진 날) }
function storyNote(kind, d = {}) {
  const S = G.story;
  if (!S) return;
  for (const id of S.active.slice()) {
    const q = QUESTS[id];
    if (q.kind !== kind || (q.menu && d.menu !== q.menu)) continue;
    const before = S.prog[id] || 0;
    if (kind === 'cook') S.prog[id] = before + (d.q === 2 ? 1 : 0);
    else if (kind === 'paid') S.prog[id] = before + (d.n || 1);
    else if (kind === 'dayServed') S.prog[id] = Math.max(before, d.served || 0);
    else if (kind === 'cleanDay') S.prog[id] = before + (d.clean ? 1 : 0);
    else S.prog[id] = before + 1;
    S.prog[id] = Math.min(q.need, S.prog[id]);
    if (S.prog[id] !== before) emit('quest');
    if (S.active.includes(id) && canFinish(id)) complete(id);
  }
}

// 영업 시작 · 다음 날: 오늘 끝낸 퀘스트 비우기, 예약한 메뉴 열기
function storyOpenDay() { if (G.story) G.story.today = []; }
function storyNextDay() {
  const S = G.story;
  const soon = S.soon;
  S.fresh = []; S.soon = [];
  for (const m of soon) openMenu(m, true);
}

// 장면을 열 때 (startFirst면 퀘스트·칭호를 먼저)
defineCmd('sceneOpen', () => {
  const S = G.story, sc = SCENES[S.queue[0]];
  if (!sc || !sc.startFirst) return;
  for (const q of sc.start || []) start(q);
  if (sc.title) S.title = sc.title;
  if (sc.opens === 'tools') S.toolsOpen = true;
  emit('quest');
  if (G.phase === 'prep') emit('prep');
});

// 장면을 다 보면: 퀘스트 시작 · 칭호 · 장 · 장식 · 가게 이름
defineCmd('sceneDone', ({ name }) => {
  const S = G.story, id = S.queue.shift();
  const sc = SCENES[id];
  if (!sc) return;
  if (sc.ask === 'shop') G.shop = (name || '').trim().slice(0, 8) || '골목분식';
  for (const q of sc.start || []) start(q);
  if (sc.title) S.title = sc.title;
  if (sc.ch !== undefined) S.ch = sc.ch;
  if (sc.decor && !S.decor.includes(sc.decor)) S.decor.push(sc.decor);
  if (sc.opens === 'tools') S.toolsOpen = true;
  // 가게를 넘겨받을 때: 오 사장님 가게 돈은 사장님이 정리해 가고, 내 돈과 창업 대출로 새로 시작
  if (sc.money === 'start') { G.cash = START_CASH; G.loan = START_LOAN; G.weekSales = 0; emit('toast', `가게 통장 · ${START_CASH.toLocaleString('ko-KR')}원으로 시작합니다`, 'good'); }
  emit('quest');
  if (G.phase === 'prep') emit('prep');
});

// 준비 화면에서 돈 내는 퀘스트 (예: 튀김기 수리비)
defineCmd('questPay', ({ id }) => {
  const q = QUESTS[id];
  if (!q || q.kind !== 'pay' || !questActive(id) || G.phase !== 'prep') return;
  if (G.cash < q.cost) { emit('toast', '잔고가 모자랍니다', 'warn'); return; }
  G.cash -= q.cost;
  emit('sfx', 'coin');
  G.story.prog[id] = q.need;
  complete(id);
  emit('prep');
});

// 냉장고를 눌렀을 때 쪽지를 찾는 퀘스트가 있으면 쪽지를 찾아요 (true면 냉장고 창은 안 열어요)

// ── js/sim/tools.js ──
// 장사 도구 규칙: 사기 · 효과 (손 수 · 미니게임 구간 · 미리 만들어 둔 그릇)

const hasTool = id => !!G.story && (G.story.tools || []).includes(id);
const handsMax = () => HANDS_MAX + (hasTool('tray') ? TOOLS.tray.effect.hands : 0);
// 미니게임 구간: 주방 타이머가 있으면 넓은 구간
const cookRule = game => hasTool('timer') ? { ...COOK_GAMES[game], ...COOK_EASE[game] } : COOK_GAMES[game];
// 새벽에 미리 만들어 둘 수 있는 그릇 수 (보온 통 · 재료가 있는 만큼만) { 메뉴: 수 }

    if (rd) for (const m in rd) if (Math.min(rd[m], stock[m] || 0) > 0) out[m] = Math.min(rd[m], stock[m] || 0);

// ── js/sim/path.js ──
// 길찾기: 칸 격자 위 4방향 너비 우선 탐색

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// from에서 goals(칸 목록) 중 가장 가까운 곳까지. 반환: 칸 목록(from 다음 칸부터) 또는 null
function findPath(from, goals, who, allow) {
  const solid = who === 'player' ? solidForPlayer : solidForCustomer;
  const ok = (x, y) => (allow && allow.some(([a, b]) => a === x && b === y)) || !solid(x, y);
  const key = (x, y) => y * W + x;
  const goalSet = new Set(goals.map(([x, y]) => key(x, y)));
  const sx = Math.round(from.x), sy = Math.round(from.y);
  if (goalSet.has(key(sx, sy))) return [];
  const prev = new Map([[key(sx, sy), -1]]);
  const q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const k = key(nx, ny);
      if (prev.has(k) || !ok(nx, ny)) continue;
      prev.set(k, key(x, y));
      if (goalSet.has(k)) {
        const path = [];
        let c = k;
        while (c !== key(sx, sy)) { path.push([c % W, Math.floor(c / W)]); c = prev.get(c); }
        return path.reverse();
      }
      q.push([nx, ny]);
    }
  }
  return null;
}

// 어떤 칸들(물체)에 붙어 설 수 있는 칸들
function standAround(tiles, who) {
  const solid = who === 'player' ? solidForPlayer : solidForCustomer;
  const out = [];
  for (const [x, y] of tiles) for (const [dx, dy] of DIRS) {
    const nx = x + dx, ny = y + dy;
    if (!solid(nx, ny) && !out.some(([a, b]) => a === nx && b === ny)) out.push([nx, ny]);
  }
  return out;
}

// 길을 따라 움직이기 (ent: x·y·path·speed·dir). 도착하면 true
function walk(ent, dt) {
  if (!ent.path || !ent.path.length) { ent.moving = false; return true; }
  let left = ent.speed * dt;
  while (left > 0 && ent.path.length) {
    const [tx, ty] = ent.path[0];
    const dx = tx - ent.x, dy = ty - ent.y, d = Math.hypot(dx, dy);
    if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) ent.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 3 : 1);
    if (d <= left) { ent.x = tx; ent.y = ty; ent.path.shift(); left -= d; }
    else { ent.x += dx / d * left; ent.y += dy / d * left; left = 0; }
  }
  ent.moving = ent.path.length > 0;
  return !ent.moving;
}
// ── js/sim/customers.js ──
// 가게 앞 보도에는 사람이 지나다녀요(유동인구). 가게 문 앞에서 일부가 들어오기로 정하면 손님이 돼요.
// 손님: 일행(1~2명)으로 보도에서 들어와 → 빈 탁자(한 일행에 한 탁자) → 메뉴 보기(가격 반응) → 주문 → 기다림 → 먹기
//       → 일행이 다 먹으면 한 명이 계산 줄에 서서 같이 계산 → 나가기
// 손님 한 명 = 그림 한 장(data/customers.js PEOPLE). 같은 사람은 가게에 동시에 둘이 있을 수 없어요.

const custById = id => G.run.customers.find(c => c.id === id);
const SEATED = ['reading', 'waitFood', 'eating', 'done', 'waitPayer'];
const isSeated = c => SEATED.includes(c.state) && c.seat >= 0;
const partyOf = c => G.run.customers.filter(q => q.party === c.party && q.state !== 'leave');
const P = c => CUSTOMER_TYPES[c.type].patience;
// 지나가는 사람(아직 가게 손님이 아닌 사람)
const PASSING = ['walk', 'glance', 'pass'];
const isPasser = c => PASSING.includes(c.state);
const shopCustomers = () => G.run.customers.filter(c => !isPasser(c));

// 보도를 따라 x에서 toX까지
function sidewalk(fromX, toX) {
  const p = [], s = Math.sign(toX - fromX);
  for (let x = fromX + s; s && x !== toX + s; x += s) p.push([x, DOOR_OUT.y]);
  return p;
}

// ── 지나가는 사람 (유동인구) ──
// 지금 가게·보도에 없는 사람 (같은 그림은 동시에 둘이 있을 수 없어요). type을 주면 그 유형만, 섞어서
function freeChars(type) {
  const here = new Set(G.run.customers.map(c => c.char));
  const out = Object.keys(PEOPLE).map(Number).filter(n => !here.has(n) && (!type || PEOPLE[n] === type));
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function spawnPasser(hour) {
  const free = freeChars();
  if (!free.length) return false;
  const mix = typeMix(hour);
  const typeCount = {};
  for (const n in PEOPLE) typeCount[PEOPLE[n]] = (typeCount[PEOPLE[n]] || 0) + 1;
  const w = {};
  for (const n of free) w[n] = (mix[PEOPLE[n]] || 0) / typeCount[PEOPLE[n]];
  const lead = +weighted(w);
  const type = PEOPLE[lead];
  const members = [lead];
  const mates = free.filter(n => n !== lead && PEOPLE[n] === type);
  if (mates.length && rand() < PAIR_CHANCE[type]) members.push(mates[Math.floor(rand() * mates.length)]);
  return spawnParty(members, {});
}
// 일행 하나를 보도 끝에서 걸어오게 해요
//  opts: force(문 앞에서 꼭 들어와요 — 단골·돌발 손님) · tag(돌발 이벤트) · reg(단골 이름) · type(유형, 없으면 PEOPLE) · wants(고를 메뉴) · delay(조금 뒤에 따라옴)
function spawnParty(members, opts) {
  const r = G.run;
  const fromLeft = rand() < 0.5;
  const party = r.nextParty = (r.nextParty || 0) + 1;
  const speed = CUSTOMER_SPEED * (0.9 + rand() * 0.2);
  members.forEach((ch, k) => {
    const sx = (fromLeft ? -1 - k : W + k) + (fromLeft ? -1 : 1) * (opts.delay || 0);
    r.customers.push({
      force: !!opts.force, tag: opts.tag || null, reg: opts.reg || null, wants: opts.wants || null,
      id: r.nextId++, char: ch, type: opts.type || PEOPLE[ch], party, lead: k === 0,
      x: sx, y: DOOR_OUT.y, dir: fromLeft ? 0 : 2, speed,
      path: sidewalk(sx, DOOR_OUT.x), state: 'walk', moving: true, lane: fromLeft ? -0.12 : 0.08,
      seat: -1, menu: null, face: null, faceT: 0, patience: 0, patMax: 1, timer: 0,
      priceSat: 0, quality: -1, foodWaitFrac: 0, payWaited: false, exitX: fromLeft ? W + k : -1 - k,
    });
  });
  return true;
}

// 아무도 없는 탁자 (자리 둘 다 비어 있어야 해요)
function freeTable() {
  const r = G.run;
  return TABLES.find(t => SEATS.every((s, i) => s.table !== t.no || r.seats[i] === null));
}

function seatParty(members, table) {
  const r = G.run;
  const seatIdx = SEATS.map((s, i) => i).filter(i => SEATS[i].table === table.no);
  members.forEach((c, k) => {
    const i = seatIdx[k];
    r.seats[i] = c.id; c.seat = i;
    const s = SEATS[i];
    c.path = findPath(c, [[s.x, s.y]], 'customer', [[s.x, s.y]]) || [];
    c.state = 'toSeat';
  });
}

function sidewalkTo(c, spot) { return findPath(c, [spot], 'customer') || []; }

// 탁자가 비면 가게 앞에서 기다리던 일행을 들여보내요
function seatFromQueue() {
  const r = G.run;
  if (r.closing || !r.queue.length) return;
  const t = freeTable(); if (!t) return;
  const first = custById(r.queue[0]); if (!first) { r.queue.shift(); return; }
  const members = r.queue.map(custById).filter(q => q && q.party === first.party);
  r.queue = r.queue.filter(id => !members.some(m => m.id === id));
  seatParty(members, t);
  r.queue.forEach((id, k) => { const q = custById(id); if (q) q.path = sidewalkTo(q, QUEUE_SPOTS[k]); });
}

function freeSeat(c) {
  const r = G.run;
  if (c.seat >= 0 && r.seats[c.seat] === c.id) r.seats[c.seat] = null;
  c.seat = -1;
  seatFromQueue();
}

function leave(c, angry) {
  const r = G.run;
  if (c.menu && c.state === 'waitFood') removeTicket(c);
  freeSeat(c);
  r.queue = r.queue.filter(id => id !== c.id);
  const wasPay = r.payLine.includes(c.id);
  r.payLine = r.payLine.filter(id => id !== c.id);
  if (wasPay) r.payLine.forEach((id, k) => { const q = custById(id); if (q) q.path = findPath(q, [PAY_SPOTS[k]], 'customer') || []; });
  const toDoor = c.y >= DOOR_OUT.y ? [] : (findPath(c, [[DOOR_OUT.x, DOOR_OUT.y]], 'customer') || []);
  const startX = toDoor.length ? DOOR_OUT.x : Math.round(c.x);
  c.path = toDoor.concat(sidewalk(startX, c.exitX));
  c.state = 'leave';
  if (angry) { c.face = 'angry'; c.faceT = 1.6; emit('sfx', 'angry'); }
}

const MISS_SAT = { full: 3, wait: 1, price: 1.5, soldout: 2 };
const MISS_TEXT = { full: '자리 없음', wait: '너무 늦어요', price: '비싸요', soldout: '품절' };
function miss(c, reason, menu, quiet) {
  const L = G.run.log;
  incidentNote('missed', c);
  L.missed[reason]++;
  L.sats.push(MISS_SAT[reason]);
  if (!quiet) {
    L.events.push({ kind: reason, menu, who: CUSTOMER_TYPES[c.type].name });
    emit('float', c.x, c.y - 1.4, MISS_TEXT[reason], 'bad');
  }
}
// 일행이 함께 나가요 (아직 먹기 전인 사람만 — 먹고 있는 사람은 마저 먹고 계산해요)
function partyLeaves(c, reason, menu) {
  const pre = ['arrive', 'queue', 'toSeat', 'reading', 'waitFood'];
  partyOf(c).forEach(m => {
    if (!pre.includes(m.state)) return;
    miss(m, reason, m.menu || menu, m !== c);
    leave(m, reason !== 'full' || m.state === 'queue');
  });
}

// 주문표에서 빼고, 아직 요리 안 한 몫이면 재료를 돌려놔요
function removeTicket(c) {
  const r = G.run;
  const i = r.tickets.findIndex(t => t.cid === c.id);
  if (i < 0) return;
  r.tickets.splice(i, 1);
  const m = c.menu;
  const handsM = r.hands.filter(d => d.menu === m).length;
  const ticketsM = r.tickets.filter(t => t.menu === m).length;
  if (handsM <= ticketsM) r.stock[m]++;
}

function reaction(c, m) {
  const fair = MENUS[m].fair * CUSTOMER_TYPES[c.type].priceMul * ratingPriceMul(G.rating) * (c.reg ? REGULARS[c.reg].priceMul : 1);
  return PRICE_REACT.find(p => G.prices[m] / fair <= p.max);
}

function decide(c) {
  const r = G.run, T = CUSTOMER_TYPES[c.type];
  const w = {};
  for (const m of MENU_IDS.filter(x => menuOpen(x))) { const ratio = G.prices[m] / (MENUS[m].fair * T.priceMul * ratingPriceMul(G.rating)); w[m] = T.likes[m] / (ratio * ratio); }
  let m = weighted(w);
  const want = c.wants || (c.reg && REGULARS[c.reg].likes.find(x => menuOpen(x) && r.stock[x] > 0));
  if (want && menuOpen(want)) m = want; // 단골은 늘 먹던 것, 돌발 손님은 정해진 것
  let re = reaction(c, m);
  c.face = re.face; c.faceT = 1.6;
  r.log.faces[re.face] = (r.log.faces[re.face] || 0) + 1;
  const pf = r.log.priceFaces[m]; pf[re.face] = (pf[re.face] || 0) + 1; // 가격 장부: 이 메뉴·이 가격에 본 얼굴
  if (re.leave && rand() < re.leave) { partyLeaves(c, 'price', m); return; }
  if (r.stock[m] <= 0) {
    const alts = MENU_IDS.filter(x => x !== m && menuOpen(x) && r.stock[x] > 0 && !reaction(c, x).leave);
    if (alts.length && rand() < 0.5) { m = alts[0]; re = reaction(c, m); }
    else { partyLeaves(c, 'soldout', m); return; }
  }
  r.stock[m]--;
  c.menu = m; c.priceSat = re.sat;
  r.tickets.push({ cid: c.id, menu: m, table: SEATS[c.seat].table });
  c.patMax = c.patience = PATIENCE.food * P(c);
  c.state = 'waitFood';
  emit('order', c.id, m);
}

// 사장이 음식을 내줬을 때 (sim/player.js)
function serve(c, dish) {
  const r = G.run;
  c.quality = dish.q;
  c.foodWaitFrac = 1 - c.patience / c.patMax;
  const i = r.tickets.findIndex(t => t.cid === c.id);
  if (i >= 0) r.tickets.splice(i, 1);
  c.state = 'eating';
  c.timer = CUSTOMER_TYPES[c.type].eat;
  c.face = dish.q === 2 ? 'love' : dish.q === 1 ? 'happy' : 'meh'; c.faceT = 1.4;
  emit('sfx', 'serve');
  storyNote('served', { menu: c.menu });
  incidentNote('served', c, dish.q);
}

function satisfaction(c) {
  let s = 3.5 + c.priceSat + [-0.2, 0.3, 0.8][Math.max(0, c.quality)];
  if (c.foodWaitFrac > 0.6) s -= 0.7;
  if (c.payWaited) s -= 0.6;
  return Math.max(1, Math.min(5, s));
}

// 계산: 계산 줄에 선 사람이 자리에 남은 일행 몫까지 같이 내요 (사장이 계산대에서 — sim/player.js)
function pay(c) {
  const r = G.run, L = r.log;
  const group = [c].concat(partyOf(c).filter(m => m !== c && m.state === 'waitPayer'));
  let total = 0, tips = 0;
  for (const m of group) {
    const T = CUSTOMER_TYPES[m.type], price = G.prices[m.menu];
    m.payWaited = c.payWaited;
    const sat = satisfaction(m);
    if (sat >= 4.5 && rand() < T.tip * 2.5) tips += rint(TIP.min / 100, TIP.max / 100) * 100;
    total += price;
    L.sales[m.menu].n++; L.sales[m.menu].rev += price; L.served++;
    L.sats.push(sat);
    const kind = m.reg ? 'regular' : m.quality === 2 ? 'perfect' : m.payWaited ? 'payWait' : m.priceSat >= 1 ? 'cheap' : 'normal';
    L.events.push({ kind, menu: m.menu, who: m.reg ? REGULARS[m.reg].name : T.name });
    incidentNote('paid', m);
    if (m.reg) emit('say', m.id, pickLine(REGULARS[m.reg].bye));
  }
  G.cash += total + tips; G.weekSales += total; L.tips += tips;
  emit('float', c.x, c.y - 1.6, '+' + (total + tips).toLocaleString('ko-KR') + '원' + (tips ? ' 팁!' : ''), 'cash');
  emit('sfx', 'coin');
  storyNote('paid', { n: group.length });
  for (const m of group) leave(m, false);
}

// 가게 앞에서: 들어올지 정하고, 안 들어오면 그냥 지나가요 (가끔 멈춰서 보거나 한마디)
function atDoor(c) {
  const r = G.run, members = partyOf(c);
  r.log.foot += members.length;
  if (c.force || rand() < (r.enterP || 0)) { // 단골·돌발 손님은 꼭 들어와요
    r.log.entered += members.length;
    members.forEach(m => { m.state = 'arrive'; m.lane = 0; });
    if (c.reg) emit('say', c.id, pickLine(REGULARS[c.reg].lines));
    return;
  }
  const glance = rand() < GLANCE_CHANCE;
  members.forEach(m => { m.state = glance ? 'glance' : 'pass'; m.timer = 0.6 + rand() * 0.5; });
  if (glance) c.dir = 1;
  if (fxRand() < PASSER_SAY_CHANCE) emit('say', c.id, passerLine());
  members.forEach(m => { if (!glance) m.path = m.path.concat(sidewalk(DOOR_OUT.x, m.exitX)); });
}
const pickLine = a => a[Math.floor(fxRand() * a.length)];
function passerLine() {
  const r = G.run, pick = a => a[Math.floor(fxRand() * a.length)];
  const busy = r.queue.length > 0 || !freeTable();
  if (busy && fxRand() < 0.7) return pick(PASSER_LINES.busy);
  if (G.ratingN >= 3 && G.rating < 2.8 && fxRand() < 0.6) return pick(PASSER_LINES.bad);
  if (G.day <= 3 && fxRand() < 0.5) return pick(PASSER_LINES.new);
  return pick(fxRand() < 0.5 ? PASSER_LINES.smell : PASSER_LINES.plain);
}

function updateCustomers(dt) {
  const r = G.run;
  for (const c of r.customers.slice()) {
    if (c.state === 'leave' && !r.customers.includes(c)) continue;
    if (c.faceT > 0) c.faceT -= dt;
    const arrived = walk(c, dt);
    switch (c.state) {
      case 'walk':
        if (arrived && c.lead) atDoor(c);
        else if (arrived) c.state = 'pass', c.path = sidewalk(Math.round(c.x), c.exitX); // 앞사람이 이미 지나갔으면
        break;
      case 'glance':
        if (!arrived) break;
        c.timer -= dt;
        if (c.timer <= 0) { c.state = 'pass'; c.path = sidewalk(Math.round(c.x), c.exitX); }
        break;
      case 'pass':
        if (arrived) r.customers.splice(r.customers.indexOf(c), 1);
        break;
      case 'arrive': {
        if (!arrived || !c.lead) break; // 일행 중 앞사람이 정해요
        const members = partyOf(c).filter(m => m.state === 'arrive');
        if (r.closing) { members.forEach(m => leave(m, false)); break; }
        const t = !r.queue.length && freeTable();
        if (t) seatParty(members, t);
        else if (r.queue.length + members.length <= QUEUE_MAX) {
          for (const m of members) {
            r.queue.push(m.id); m.state = 'queue';
            m.patMax = m.patience = PATIENCE.queue * P(m);
            m.path = sidewalkTo(m, QUEUE_SPOTS[r.queue.length - 1]);
          }
        } else members.forEach((m, k) => { miss(m, 'full', null, k > 0); leave(m, false); });
        break;
      }
      case 'queue':
        c.patience -= dt;
        if (r.closing) { leave(c, false); break; }
        if (c.patience <= 0) partyLeaves(c, 'full');
        break;
      case 'toSeat':
        if (arrived) { c.state = 'reading'; c.timer = READ_MENU_SEC * (0.8 + rand() * 0.5); c.dir = SEATS[c.seat].face === 'right' ? 0 : 2; }
        break;
      case 'reading':
        c.timer -= dt;
        if (c.timer <= 0) decide(c);
        break;
      case 'waitFood':
        c.patience -= dt;
        if (c.patience <= 0) partyLeaves(c, 'wait', c.menu);
        break;
      case 'eating':
        c.timer -= dt;
        if (c.timer <= 0) c.state = 'done';
        break;
      case 'done': {
        // 일행이 모두 다 먹었으면 앞사람(남은 사람 중 첫째)이 계산 줄로
        const party = partyOf(c);
        if (party.some(m => m.state !== 'done' && m.state !== 'waitPayer')) break;
        if (party[0] !== c) { c.state = 'waitPayer'; break; }
        if (r.payLine.length >= PAY_SPOTS.length) break;
        r.payLine.push(c.id);
        party.forEach(m => { if (m !== c) m.state = 'waitPayer'; });
        c.state = 'payLine';
        freeSeat(c); // 일행이 아직 앉아 있으면 탁자는 비지 않아요
        c.path = findPath(c, [PAY_SPOTS[r.payLine.length - 1]], 'customer') || [];
        c.patMax = c.patience = PATIENCE.pay * P(c);
        break;
      }
      case 'payLine':
        if (r.payLine[0] === c.id && arrived) {
          c.dir = 0;
          c.patience -= dt;
          if (c.patience <= 0) { c.payWaited = true; pay(c); }
        }
        break;
      case 'leave':
        if (arrived) r.customers.splice(r.customers.indexOf(c), 1);
        break;
    }
  }
}

// ── 단골 ── 영업 시작 때 오늘 올지·언제 올지 정하고, 그 시각이 되면 보도에서 걸어와요
function planRegulars(r) {
  r.regulars = Object.keys(REGULARS).filter(id => rand() < REGULARS[id].chance)
    .map(id => ({ id, at: REGULARS[id].at[0] + rand() * (REGULARS[id].at[1] - REGULARS[id].at[0]), came: false }));
}
function tickRegulars() {
  const r = G.run;
  for (const g of r.regulars || []) {
    if (g.came || r.min < g.at || r.closing) continue;
    const R = REGULARS[g.id];
    if (r.customers.some(c => c.char === R.char)) continue;
    g.came = true;
    spawnParty([R.char], { force: true, reg: g.id, type: R.type });
  }
}
// ── js/sim/incidents.js ──
// 돌발 이벤트 진행 (data/incidents.js): 그날 고르기 · 시작 · 세기 · 성공/실패와 보상.
// 화면은 만지지 않고 사건만: emit('incident', 'start'|'end', 돌발) · toast

const fillText = (s, d) => s.replace('{menu}', d.menu ? MENUS[d.menu].name : '').replace('{qty}', d.qty || '');

// 영업 시작 때 오늘 일어날 돌발을 정해 둬요 (그날 씨앗 rand라 같은 날은 같은 일이 일어나요)
function planIncidents(r) {
  r.incidents = [];
  const pool = Object.keys(INCIDENTS).filter(id => G.day >= INCIDENTS[id].minDay);
  let n = INCIDENTS_PER_DAY(G.day);
  while (n-- > 0 && pool.length) {
    const id = weighted(Object.fromEntries(pool.map(k => [k, INCIDENTS[k].weight])));
    pool.splice(pool.indexOf(id), 1);
    const D = INCIDENTS[id];
    r.incidents.push({ id, at: D.from + rand() * (D.to - D.from), state: 'wait' });
  }
}

// 지금 바로 일으키기 (개발자 모드)
function forceIncident(id) {
  const r = G.run;
  if (!r || r.closing || !INCIDENTS[id]) return;
  r.incidents.push({ id, at: r.min, state: 'wait' });
}

const activeIncidents = () => (G.run ? G.run.incidents.filter(x => x.state === 'on') : []);
const incidentInfo = x => ({ ...INCIDENTS[x.id], text: fillText(INCIDENTS[x.id].text, x) });

function startIncident(x) {
  const r = G.run, D = INCIDENTS[x.id];
  x.state = 'on'; x.t0 = r.min;
  if (D.kind === 'group') {
    const chars = freeChars('student');
    if (chars.length < 2) { x.state = 'skip'; return; }
    const n = Math.min(D.size, chars.length - (chars.length % 2));
    x.need = n; x.paid = 0;
    for (let k = 0; k < n; k += 2) spawnParty(chars.slice(k, k + 2), { force: true, tag: x, delay: k });
  } else if (D.kind === 'takeout') {
    const ms = MENU_IDS.filter(m => menuOpen(m) && r.stock[m] >= 1);
    if (!ms.length) { x.state = 'skip'; return; }
    x.menu = ms[Math.floor(rand() * ms.length)];
    x.qty = Math.min(D.qty, r.stock[x.menu]);
    x.left = x.qty; x.until = r.min + D.limit;
    r.stock[x.menu] -= x.qty;
    for (let i = 0; i < x.qty; i++) r.tickets.push({ cid: -1, menu: x.menu, table: 0, takeout: x });
    emit('order', -1, x.menu);
  } else if (D.kind === 'mission') {
    x.count = 0; x.until = D.until;
  } else if (D.kind === 'guest') {
    const chars = freeChars('worker');
    if (!chars.length) { x.state = 'skip'; return; }
    x.menu = menuOpen(D.menu) ? D.menu : MENU_IDS.find(m => menuOpen(m));
    x.until = r.min + D.limit;
    spawnParty([chars[0]], { force: true, tag: x, wants: x.menu });
  }
  emit('incident', 'start', x);
  emit('sfx', 'surprise');
}

function endIncident(x, ok) {
  const r = G.run, D = INCIDENTS[x.id];
  if (x.state !== 'on') return;
  x.state = ok ? 'win' : 'lose';
  if (ok) {
    const bonus = D.reward || D.tip || 0;
    if (bonus) { G.cash += bonus; r.log.tips += bonus; }
    if (D.kind === 'guest') { for (let i = 0; i < 3; i++) r.log.sats.push(5); r.log.events.push({ kind: 'blogger', menu: x.menu, who: '블로거' }); }
  }
  if (D.kind === 'takeout' && !ok) { // 못 만든 몫은 재료를 돌려놔요 (이미 만든 건 손에 남아요)
    const left = r.tickets.filter(t => t.takeout === x);
    r.tickets = r.tickets.filter(t => t.takeout !== x);
    const handsM = r.hands.filter(d => d.menu === x.menu).length, others = r.tickets.filter(t => t.menu === x.menu).length;
    r.stock[x.menu] += Math.max(0, left.length - Math.max(0, handsM - others));
    r.log.sats.push(2);
  }
  (r.log.incidents = r.log.incidents || []).push({ name: D.name, ok, bonus: ok ? (D.reward || D.tip || 0) : 0 });
  emit('incident', 'end', x);
  emit('toast', ok ? D.win : D.lose, ok ? 'good' : 'warn');
  emit('sfx', ok ? 'perfect' : 'angry');
}

// 매 걸음 (sim/day.js tickDay)
function tickIncidents() {
  const r = G.run;
  for (const x of r.incidents) {
    if (x.state === 'wait' && r.min >= x.at && !r.closing) startIncident(x);
    else if (x.state === 'on' && x.until !== undefined && r.min >= x.until) endIncident(x, false);
  }
}
// 마감: 아직 진행 중인 것은 실패로
function closeIncidents() { for (const x of G.run.incidents) if (x.state === 'on') endIncident(x, false); }

// 규칙 코드가 알려 주는 일
//  paid(손님) · missed(손님) · served(손님, 품질) · cook(품질)
function incidentNote(kind, c, q) {
  const r = G.run;
  if (!r) return;
  if (kind === 'cook') {
    for (const x of activeIncidents()) if (INCIDENTS[x.id].kind === 'mission' && q === 2 && ++x.count >= INCIDENTS[x.id].need) endIncident(x, true);
    return;
  }
  const x = c && c.tag;
  if (!x || x.state !== 'on') return;
  const D = INCIDENTS[x.id];
  if (D.kind === 'group') {
    if (kind === 'paid' && ++x.paid >= x.need) endIncident(x, true);
    if (kind === 'missed') endIncident(x, false);
  } else if (D.kind === 'guest') {
    if (kind === 'served') endIncident(x, q === 2);
    if (kind === 'missed') endIncident(x, false);
  }
}

// 포장: 계산대에 서면 손에 든 포장 몫을 넘겨요 (sim/player.js)
function handTakeout() {
  const r = G.run;
  for (const x of activeIncidents().filter(x => INCIDENTS[x.id].kind === 'takeout')) {
    while (x.left > 0) {
      const i = r.hands.findIndex(d => d.menu === x.menu);
      if (i < 0) break;
      r.hands.splice(i, 1);
      const ti = r.tickets.findIndex(t => t.takeout === x);
      if (ti >= 0) r.tickets.splice(ti, 1);
      x.left--;
      const price = G.prices[x.menu];
      G.cash += price; G.weekSales += price;
      r.log.sales[x.menu].n++; r.log.sales[x.menu].rev += price;
      emit('float', r.player.x, r.player.y - 1.6, `포장 +${price.toLocaleString('ko-KR')}원`, 'cash');
      emit('sfx', 'coin');
    }
    if (x.left <= 0) endIncident(x, true);
  }
}
const takeoutWaiting = () => activeIncidents().some(x => INCIDENTS[x.id].kind === 'takeout' && x.left > 0);
// ── js/sim/day.js ──
// 하루의 흐름: 준비(prep: 가격·재료 주문) → 아침 재료 도착 → 낮 영업(day) → 마감 정산(receipt) → (7일마다) 주간 정산(weekly) → 다음 날 준비
// 재료는 유통기한(MENUS.shelf)까지 남겨 두고 다음 날 써요. 먼저 받은 재료부터 써요.

const openMenus = () => MENU_IDS.filter(m => menuOpen(m));
const prepCost = () => openMenus().reduce((s, m) => s + G.prep[m] * MENUS[m].cost, 0); // 주문 금액 (아침 도착 때 결제)
const invCount = m => (G.inv[m] || []).reduce((s, b) => s + b.n, 0);
const zeros = () => Object.fromEntries(MENU_IDS.map(m => [m, 0]));
const rushCost = m => Math.round(MENUS[m].cost * RUSH_QTY * RUSH_MUL / 100) * 100;
// 재료를 n인분 들여놓아요 (오늘부터 shelf일 동안 쓸 수 있어요)
function stockIn(m, n) { if (n > 0) G.inv[m].push({ n, exp: G.day + MENUS[m].shelf - 1 }); }
// 먼저 받은 재료부터 n인분 써요
function useFifo(m, n) {
  const b = G.inv[m].sort((a, c) => a.exp - c.exp);
  while (n > 0 && b.length) { const k = Math.min(n, b[0].n); b[0].n -= k; n -= k; if (!b[0].n) b.shift(); }
}
const isWeeklyNight = () => G.day % 7 === 0;

function setPhase(p) { G.phase = p; emit('phase', p); }

function newRun() {
  return {
    min: 0, speed: 1, paused: false, closing: false,
    stock: Object.fromEntries(MENU_IDS.map(m => [m, invCount(m)])), added: zeros(), rush: [], rushExtra: 0,
    customers: [], nextId: 1, tickets: [], hands: [],
    seats: SEATS.map(() => null), queue: [], payLine: [],
    player: { x: PLAYER_START.x, y: PLAYER_START.y, path: [], speed: PLAYER_SPEED, dir: 3, moving: false, target: null, payT: 0, char: 0 },
    cook: null, spawnAcc: 0,
    log: {
      sales: Object.fromEntries(MENU_IDS.map(m => [m, { n: 0, rev: 0 }])), tips: 0, served: 0,
      missed: { full: 0, wait: 0, price: 0, soldout: 0 }, sats: [], events: [], wasteDishes: 0, faces: {}, foot: 0, entered: 0,
      priceFaces: Object.fromEntries(MENU_IDS.map(m => [m, {}])),
    },
  };
}

// ── 새벽 준비 ──
defineCmd('setPrice', ({ menu, delta }) => {
  G.prices[menu] = Math.max(PRICE_MIN, Math.min(PRICE_MAX, G.prices[menu] + delta * PRICE_STEP));
  emit('prep');
});
defineCmd('setPrep', ({ menu, delta }) => {
  G.prep[menu] = Math.max(0, Math.min(PREP_MAX, G.prep[menu] + delta * PREP_STEP));
  emit('prep');
});
// 가게 열기: 주문한 재료가 도착하고(이때 값을 내요) 영업을 시작해요
defineCmd('openShop', () => {
  const cost = prepCost();
  if (cost > G.cash) { emit('toast', '주문 금액이 잔고보다 많습니다. 주문량을 줄여 보세요', 'warn'); return false; }
  if (!G.baseSeed) G.baseSeed = newSeed();
  seedRand(G.baseSeed + G.day * 7919);
  G.cash -= cost;
  const ordered = Object.fromEntries(MENU_IDS.map(m => [m, menuOpen(m) ? G.prep[m] : 0]));
  for (const m of MENU_IDS) stockIn(m, ordered[m]);
  G.run = newRun();
  G.run.ordered = ordered; G.run.orderCost = cost;
  G.run.startStock = { ...G.run.stock };
  G.run.ready = {}; // 새벽에 미리 끓여 둔 그릇 { 메뉴: [품질, …] }
  planRegulars(G.run); planIncidents(G.run); // 오늘 올 단골 · 오늘 일어날 돌발 (그날 씨앗으로)
  storyOpenDay();
  setPhase('day');
  const n = Object.values(ordered).reduce((a, b) => a + b, 0);
  // 보온 통이 있으면 새벽 6시: 재료가 도착하고, 문 열기 전에 미리 끓여 둘 수 있어요 (그동안 가게 시계는 멈춰요)
  const cap = readyCap(G.run.stock);
  if (Object.keys(cap).length) {
    G.run.dawn = { cap };
    emit('toast', `새벽 6시${n ? `, 재료 ${n}인분 도착` : ''}`, 'info');
    emit('dawn', true);
  } else startBusiness(n);
  return true;
});
function startBusiness(n) {
  emit('sfx', 'open');
  emit('toast', `${G.day}일차 영업 시작!${n ? ` 재료 ${n}인분 도착` : ''}`, 'good');
}
// 새벽: 미리 끓이기 (미니게임은 sim/player.js startCook과 같아요)
defineCmd('dawnCook', ({ menu }) => {
  const r = G.run;
  if (!r || !r.dawn || r.cook) return;
  const m = menu || Object.keys(r.dawn.cap)[0];
  if ((r.ready[m] || []).length >= r.dawn.cap[m]) return;
  startDawnCook(m);
});
defineCmd('dawnDone', () => {
  const r = G.run;
  if (!r || !r.dawn || r.cook) return;
  r.dawn = null;
  emit('dawn', false);
  startBusiness(0);
});
// 급구매: 영업 중에 근처 마트에서 재료를 사 와요 (비싸고 조금 기다려야 와요)
defineCmd('rushBuy', ({ menu }) => {
  const r = G.run;
  if (!r || r.closing || !menuOpen(menu)) return;
  const cost = rushCost(menu);
  if (cost > G.cash) { emit('toast', '잔고가 모자랍니다', 'warn'); return; }
  G.cash -= cost;
  r.rushExtra += cost - MENUS[menu].cost * RUSH_QTY;
  r.rush.push({ menu, n: RUSH_QTY, t: RUSH_SEC });
  emit('toast', `${MENUS[menu].ing} ${RUSH_QTY}인분을 급하게 주문했습니다. 곧 도착합니다`, 'info');
  emit('fridge');
});
// 일찍 마감: 새 손님은 받지 않고, 안에 있는 손님만 마저 받아요
defineCmd('closeEarly', () => {
  const r = G.run;
  if (!r || r.closing) return;
  r.closing = true; r.closeMin = r.min;
  emit('toast', '영업을 마감합니다. 남은 손님만 받습니다', 'info');
  emit('closing');
});
defineCmd('pause', ({ on }) => { if (G.run) G.run.paused = on; emit('pause', on); });
defineCmd('speed', ({ x }) => { if (G.run) G.run.speed = x; });
// 대화 장면을 보는 동안 가게를 잠깐 멈춰요 (쉬기 화면은 안 띄워요)
defineCmd('hold', ({ on }) => { if (G.run) G.run.paused = on; });

// ── 영업 중: 시계·손님 들어오기·마감 ──
function tickDay(dt) {
  const r = G.run;
  r.min += dt * DAY_MIN / DAY_SEC;
  if (!r.closing && r.min >= DAY_MIN) {
    r.closing = true; r.closeMin = DAY_MIN;
    emit('toast', '21시, 영업을 마감합니다. 남은 손님만 받습니다', 'info');
    emit('closing');
  }
  // 가게 앞 보도에 사람이 지나가요. 그중 일부가 들어와 손님이 돼요 (마감 뒤에는 지나가기만)
  const hour = 9 + Math.floor(r.min / 60);
  const foot = FOOT_PER_HOUR[hour] || 8;
  // 들어올 손님 = 시간대 기대값 × 별점 × 개업 초기 × 상권(경쟁 강도·메뉴 궁합 — data/district.js)
  const visits = r.closing ? 0 : (SPAWN_PER_HOUR[hour] || 0) * ratingSpawnMul(G.rating) * openingMul(G.day) * districtVisitMul(openMenus());
  r.enterP = Math.min(0.9, visits / foot);
  r.spawnAcc += foot / (DAY_SEC / 12) * dt * (0.85 + rand() * 0.3);
  while (r.spawnAcc >= 1) { r.spawnAcc -= 1; spawnPasser(hour); }
  tickRegulars(); tickIncidents();
  // 급구매한 재료 도착 (실제 초 기준)
  for (const o of r.rush.slice()) {
    o.t -= dt;
    if (o.t > 0) continue;
    r.rush.splice(r.rush.indexOf(o), 1);
    r.stock[o.menu] += o.n; r.added[o.menu] += o.n; stockIn(o.menu, o.n);
    emit('toast', `${MENUS[o.menu].ing} ${o.n}인분이 도착했습니다`, 'good');
    emit('fridge');
  }
  // 메뉴 재료가 처음 떨어지면 급구매를 알려 줘요 (메뉴마다 한 번)
  for (const m of openMenus()) {
    if (r.closing || r.stock[m] > 0 || (r.outHint || {})[m] || r.rush.some(o => o.menu === m)) continue;
    (r.outHint = r.outHint || {})[m] = true;
    emit('toast', `${josa(MENUS[m].ing, '이/가')} 떨어졌습니다. 냉장고를 눌러 급구매해 보세요`, 'hint');
  }
  // 재료가 다 떨어지면 일찍 마감할 수 있다고 알려 줘요 (한 번만)
  if (!r.closing && !r.soldOutHint && !r.rush.length && openMenus().every(m => r.stock[m] <= 0) && !r.tickets.length) {
    r.soldOutHint = true;
    emit('toast', '재료가 모두 떨어졌습니다. 쉬기(❚❚)에서 일찍 마감해 보세요', 'hint');
  }
  if (r.closing && (shopCustomers().length === 0 || r.min >= Math.max(CLOSE_CAP_MIN, r.closeMin + 60))) endDay();
}

// ── 마감 정산 ──
function pickReviews(events) {
  const byKind = {};
  for (const e of events) (byKind[e.kind] = byKind[e.kind] || []).push(e);
  const kinds = Object.keys(byKind).sort((a, b) =>
    (REVIEW_TEMPLATES[b].salience * Math.min(3, byKind[b].length)) - (REVIEW_TEMPLATES[a].salience * Math.min(3, byKind[a].length)));
  return kinds.slice(0, 3).map(k => {
    const e = pick(byKind[k]), t = REVIEW_TEMPLATES[k];
    const menu = e.menu ? MENUS[e.menu].name : '음식';
    return { stars: t.stars, who: e.who, text: pick(t.lines).replace(/\{menu(?::([^}]+))?\}/g, (_, j) => j ? josa(menu, j) : menu) };
  });
}

function endDay() {
  const r = G.run, L = r.log;
  closeIncidents(); // 끝나지 않은 돌발은 실패로
  // 팔지 못한 미리 끓인 그릇은 버려요 (그만큼 재료도 썼어요)
  let readyLeft = 0;
  for (const m in r.ready) { const k = Math.min(r.ready[m].length, Math.max(0, r.stock[m])); r.stock[m] -= k; readyLeft += k * MENUS[m].cost; }
  const revenue = MENU_IDS.reduce((s, m) => s + L.sales[m].rev, 0);
  // 오늘 쓴 재료: 처음 재고 + 급구매 − 남은 재고 (먼저 받은 것부터). 그다음 유통기한이 오늘까지인 재료는 버려요
  const used = {}, expired = {};
  let usedCost = 0, expiredCost = 0;
  for (const m of MENU_IDS) {
    used[m] = Math.max(0, r.startStock[m] + r.added[m] - r.stock[m]);
    useFifo(m, used[m]); usedCost += used[m] * MENUS[m].cost;
    expired[m] = G.inv[m].filter(b => b.exp <= G.day).reduce((s, b) => s + b.n, 0);
    G.inv[m] = G.inv[m].filter(b => b.exp > G.day);
    expiredCost += expired[m] * MENUS[m].cost;
  }
  r.rush.forEach(o => { G.cash += rushCost(o.menu); r.rushExtra -= rushCost(o.menu) - MENUS[o.menu].cost * o.n; }); // 도착 전 마감한 급구매는 취소
  const leftover = Object.fromEntries(MENU_IDS.map(m => [m, invCount(m)]));
  const dishWaste = r.hands.reduce((s, d) => s + MENUS[d.menu].cost, 0) + L.wasteDishes + readyLeft; // 만들고 못 판 음식 (쓴 재료값 안에 들어 있어요)
  const missed = Object.values(L.missed).reduce((a, b) => a + b, 0);
  const dayRating = L.sats.length ? L.sats.reduce((a, b) => a + b, 0) / L.sats.length : null;
  const before = G.rating;
  if (dayRating !== null) {
    G.rating = G.ratingN ? G.rating * 0.7 + dayRating * 0.3 : dayRating;
    G.ratingN++;
  }
  const net = revenue + L.tips - usedCost - expiredCost - r.rushExtra;
  const rec = {
    day: G.day, revenue, tips: L.tips, usedCost, expiredCost, expired, rushExtra: r.rushExtra, dishWaste, leftover, net,
    sales: L.sales, served: L.served, missed: L.missed, missedTotal: missed,
    avgSpend: L.served ? Math.round(revenue / L.served) : 0,
    dayRating, rating: G.rating, ratingDelta: G.rating - before, foot: L.foot, entered: L.entered, closeMin: r.closeMin ?? DAY_MIN,
    incidents: L.incidents || [], reviews: pickReviews(L.events), prices: { ...G.prices }, ordered: r.ordered, faces: L.faces, priceFaces: L.priceFaces,
  };
  G.history.push({ day: G.day, revenue, net, served: L.served, missed, rating: dayRating, prep: { ...r.ordered }, stockStart: { ...r.startStock }, sold: Object.fromEntries(MENU_IDS.map(m => [m, L.sales[m].n])) });
  if (G.history.length > 60) G.history.shift();
  G.stats.served += L.served; G.stats.sales += revenue;
  // 가격 장부: 메뉴마다, 가격마다 손님 얼굴을 쌓아 둬요 (준비 화면에서 보여 줘요)
  for (const m of MENU_IDS) {
    const f = L.priceFaces[m]; if (!Object.keys(f).length) continue;
    const book = (G.ledger[m] = G.ledger[m] || {}), p = G.prices[m], e = (book[p] = book[p] || {});
    for (const k in f) e[k] = (e[k] || 0) + f[k];
  }
  // 이야기: 오늘 영업 결과로 퀘스트 세기 (재료가 안 떨어진 날 = 품절로 놓친 손님이 없고, 연 메뉴마다 재료가 남음)
  const clean = !L.missed.soldout && openMenus().every(m => r.stock[m] > 0);
  storyNote('receipt'); storyNote('dayServed', { served: L.served }); storyNote('cleanDay', { clean }); storyNote('dayEnd');
  rec.quests = G.story.today.slice();
  G.lastReceipt = rec;
  G.run = null;
  setPhase('receipt');
}

// 영수증 다음: 7일째 밤이면 주간 정산, 아니면 다음 날 준비
defineCmd('afterReceipt', () => {
  if (isWeeklyNight()) {
    const loanPay = Math.min(LOAN_WEEKLY, G.loan);
    G.lastWeekly = { week: G.day / 7, sales: G.weekSales, rent: WEEK_RENT, loanPay, loanLeft: G.loan - loanPay };
    G.cash -= WEEK_RENT + loanPay;
    G.loan -= loanPay;
    G.weekSales = 0;
    storyNote('weekly');
    G.lastWeekly.quests = G.story.today.slice();
    setPhase('weekly');
  } else nextDay();
});
defineCmd('afterWeekly', () => nextDay());

function nextDay() {
  G.day++;
  // 주문량 추천: (어제 판 만큼 + 5인분) − 남아 있는 재료, 5인분 단위
  const last = G.history[G.history.length - 1];
  for (const m of MENU_IDS) {
    if (last && menuOpen(m)) G.prep[m] = Math.min(PREP_MAX, Math.max(0, Math.ceil((last.sold[m] + 5 - invCount(m)) / 5) * 5));
  }
  storyNextDay(); // 예약한 메뉴는 처음 주문량으로 열려요
  setPhase('prep');
}
// ── js/sim/player.js ──
// 사장: 누른 곳으로 가서 할 일을 해요.
//  조리대 → 메뉴마다 다른 조리 미니게임(졸이기·말기·튀기기) → 손에 들기(최대 2개)
//  손님(또는 그 탁자) → 들고 있는 음식 내주기 · 계산대 → 서 있는 동안 계산 · 퇴식대 → 들고 있는 음식 버리기

const has = (tiles, x, y) => tiles.some(([a, b]) => a === x && b === y);
const handsCount = m => G.run.hands.filter(d => d.menu === m).length;
const ticketsCount = m => G.run.tickets.filter(t => t.menu === m).length;

// 한 탁자에서 음식을 기다리는 손님 중 내줄 사람 (들고 있는 음식과 맞는 사람 먼저, 오래 기다린 사람 먼저)
function waiterAtTable(no, prefer) {
  const r = G.run;
  const list = r.customers.filter(c => c.state === 'waitFood' && c.seat >= 0 && SEATS[c.seat].table === no)
    .sort((a, b) => a.patience - b.patience);
  const match = c => r.hands.some(d => d.menu === c.menu);
  return (prefer && match(prefer) && prefer) || list.find(match) || prefer || list[0] || null;
}

// 누른 자리(칸 좌표, 소수점까지)가 무엇인지 → 할 일
function targetAt(fx, fy) {
  const r = G.run;
  const x = Math.floor(fx), y = Math.floor(fy);
  // 1) 사람 그림을 눌렀는지 (그림은 발밑 칸에서 위로 한 칸 반, 주문 말풍선까지)
  const hit = r.customers.filter(c => c.state !== 'leave' && fx >= c.x - 0.1 && fx < c.x + 1.1 && fy >= c.y - (c.state === 'waitFood' ? 2.2 : 1.3) && fy < c.y + 1)
    .sort((a, b) => b.y - a.y);
  for (const c of hit) {
    if (c.state === 'waitFood') { const w = waiterAtTable(SEATS[c.seat].table, c); return { kind: 'serve', cid: w.id }; }
    if (c.state === 'payLine') return { kind: 'register' };
  }
  // 2) 탁자·자리 칸
  const seat = SEATS.find(s => s.x === x && s.y === y);
  const table = TABLES.find(t => x >= t.x && x < t.x + t.w && fy >= t.y - 0.65 && fy < t.y + 1); // 탁자 그림은 조금 올라가 있어요
  const no = seat ? seat.table : table ? table.no : 0;
  if (no) { const w = waiterAtTable(no); return w ? { kind: 'serve', cid: w.id } : null; }
  // 3) 조리대·계산대
  for (const id in STATIONS) {
    const st = STATIONS[id];
    if (st.menu && !menuOpen(st.menu)) continue; // 아직 없는 조리대
    if (has(st.tiles, x, y) || has(st.stand, x, y)) return { kind: 'station', id };
  }
  if (has(REGISTER.tiles, x, y) || has(REGISTER.stand, x, y) || has(PAY_SPOTS, x, y)) return { kind: 'register' };
  if (!solidForPlayer(x, y)) return { kind: 'move', x, y };
  return null;
}

function standFor(t) {
  if (t.kind === 'station') return STATIONS[t.id].stand;
  if (t.kind === 'register') return REGISTER.stand;
  if (t.kind === 'serve') {
    const c = custById(t.cid);
    if (!c || c.seat < 0) return null;
    const s = SEATS[c.seat], tb = TABLES.find(q => q.no === s.table);
    const tiles = [[s.x, s.y]];
    for (let k = 0; k < tb.w; k++) tiles.push([tb.x + k, tb.y]);
    return standAround(tiles, 'player'); // 탁자 옆 어디서든 내줄 수 있어요
  }
  return [[t.x, t.y]];
}

// 화면을 눌렀을 때 (x·y: 칸 좌표, 소수점까지)
defineCmd('tap', ({ x, y }) => {
  const r = G.run;
  if (!r || G.phase !== 'day') return;
  if (r.cook) { cookTap(); return; }
  if (r.dawn) return; // 새벽에는 가게를 돌아다니지 않아요
  const t = targetAt(x, y);
  if (!t) return;
  const goals = standFor(t);
  if (!goals || !goals.length) return;
  const p = r.player;
  const path = findPath(p, goals, 'player');
  if (!path) return;
  p.path = path; p.target = t; p.payT = 0;
  emit('tapMark', Math.floor(x), Math.floor(y), t.kind);
  if (!path.length) arriveAt(p); // 이미 그 자리에 서 있으면 바로 해요
});

defineCmd('cookTap', () => cookTap());
defineCmd('cookStop', () => cookTap()); // 옛 이름

// ── 조리 미니게임 ──
function startCook(st) {
  const r = G.run, m = st.menu;
  if (r.hands.length >= handsMax()) { emit('toast', '손이 꽉 찼습니다. 먼저 내주거나 퇴식대에 버려 보세요', 'warn'); return; }
  if (ticketsCount(m) <= handsCount(m)) {
    emit('toast', ticketsCount(m) ? `${MENUS[m].name} 주문은 이미 손에 들고 있습니다` : `아직 ${MENUS[m].name} 주문이 없습니다`, 'info');
    return;
  }
  // 보온 통: 새벽에 미리 끓여 둔 그릇이 있으면 미니게임 없이 바로 들어요 (좋은 것부터)
  const rd = r.ready && r.ready[m];
  if (rd && rd.length) {
    rd.sort((a, b) => b - a);
    const q = rd.shift();
    r.hands.push({ menu: m, q });
    emit('float', r.player.x, r.player.y - 1.8, `미리 끓여 둔 ${MENUS[m].name}`, 'good');
    emit('sfx', 'cookDone');
    emit('cook', false, m, MENUS[m].game, q);
    return;
  }
  r.cook = { menu: m, game: MENUS[m].game, t: 0, speed: MENUS[m].cook, pos: 0, taps: 0 };
  emit('cook', true, m, r.cook.game);
  emit('sfx', 'cookStart');
}

// 새벽에 미리 끓이기 (sim/day.js dawnCook) — 주문 없이, 손에 들지 않고 보온 통에 담아요
function startDawnCook(m) {
  const r = G.run;
  r.cook = { menu: m, game: MENUS[m].game, t: 0, speed: MENUS[m].cook, pos: 0, taps: 0, dawn: true };
  emit('cook', true, m, r.cook.game);
  emit('sfx', 'cookStart');
}

function cookTap() {
  const r = G.run, c = r && r.cook;
  if (!c) return;
  const g = cookRule(c.game);
  if (c.game === 'stir') {
    const d = Math.abs(c.pos - 0.5);
    finishCook(d <= g.zone.perfect ? 2 : d <= g.zone.good ? 1 : 0);
  } else if (c.game === 'roll') {
    c.taps++; c.pos = c.taps / g.taps;
    emit('sfx', 'tap');
    if (c.taps >= g.taps) finishCook(c.t <= g.perfect ? 2 : c.t <= g.good ? 1 : 0);
  } else if (c.game === 'fry') {
    const p = c.pos, inZ = z => p >= z[0] && p <= z[1];
    finishCook(inZ(g.perfect) ? 2 : inZ(g.good) ? 1 : 0, p < g.good[0] ? '덜 익음' : p > g.good[1] ? '많이 익음' : '');
  }
}

function updateCook(c, dt) {
  const g = cookRule(c.game);
  c.t += dt;
  if (c.game === 'stir') {
    c.pos = 0.5 - 0.5 * Math.cos(c.t * 2.6 * c.speed); // 0~1을 오가요
    if (c.t >= g.timeout) finishCook(0);
  } else if (c.game === 'roll') {
    if (c.t >= g.timeout) finishCook(0, '덜 말림');
  } else if (c.game === 'fry') {
    c.pos = Math.min(1, c.t / g.sec); // 한 번만 지나가요
    if (c.pos >= 1) finishCook(0, '탔어요');
  }
}

// 조리 미니게임은 빨리감기와 상관없이 실제 시간으로 흘러요 (sim/loop.js가 매 프레임 불러요)
function tickCook(realDt) {
  const r = G.run;
  if (r && r.cook) updateCook(r.cook, realDt);
}

function finishCook(q, note) {
  const r = G.run, c = r.cook;
  r.cook = null;
  if (c.dawn) { // 새벽: 보온 통에 담아요
    (r.ready[c.menu] = r.ready[c.menu] || []).push(q);
    emit('sfx', q === 2 ? 'perfect' : 'cookDone');
    emit('cook', false, c.menu, c.game, q);
    emit('dawn', true, q);
    return;
  }
  r.hands.push({ menu: c.menu, q });
  const p = r.player;
  emit('float', p.x, p.y - 1.8, note && q < 2 ? `${note}…` : `${MENUS[c.menu].name} ${QUALITY_NAME[q]}${q === 2 ? '!' : ''}`, q === 2 ? 'great' : q === 1 ? 'good' : 'plain');
  emit('sfx', q === 2 ? 'perfect' : 'cookDone');
  emit('cook', false, c.menu, c.game, q);
  storyNote('cook', { menu: c.menu, q });
  incidentNote('cook', null, q);
}

// ── 내주기·버리기 ──
function serveTo(cid) {
  const r = G.run;
  let c = custById(cid);
  if (!c || c.state !== 'waitFood') {
    // 그 사이에 상황이 바뀌었으면 같은 탁자에서 다른 사람을 찾아요
    const no = c && c.seat >= 0 ? SEATS[c.seat].table : 0;
    c = no ? waiterAtTable(no) : null;
    if (!c) return;
  }
  const no = SEATS[c.seat].table;
  if (!r.hands.some(d => d.menu === c.menu)) c = waiterAtTable(no) || c;
  const i = r.hands.map((d, k) => [d, k]).filter(([d]) => d.menu === c.menu).sort((a, b) => b[0].q - a[0].q)[0];
  if (!i) { emit('toast', `이 손님은 ${josa(MENUS[c.menu].name, '을/를')} 주문했습니다`, 'info'); return; }
  r.hands.splice(i[1], 1);
  serve(c, i[0]);
  // 같은 탁자에 들고 있는 음식을 기다리는 사람이 또 있으면 이어서 내줘요
  const next = waiterAtTable(no);
  if (next && next.state === 'waitFood' && r.hands.some(d => d.menu === next.menu)) serveTo(next.id);
}

function trash() {
  const r = G.run;
  if (!r.hands.length) { emit('toast', '퇴식대입니다. 남는 음식을 여기에 버릴 수 있습니다', 'info'); return; }
  const d = r.hands.pop();
  r.log.wasteDishes += MENUS[d.menu].cost;
  emit('float', r.player.x, r.player.y - 1.6, `${MENUS[d.menu].name} 버림`, 'bad');
  emit('sfx', 'trash');
}

function arriveAt(p) {
  const t = p.target;
  if (!t) return;
  if (t.kind === 'station') {
    p.dir = 1;
    const st = STATIONS[t.id];
    if (st.menu) startCook(st);
    else if (t.id === 'fridge') { if (!storyFridge()) emit('fridge', true); } // 냉장고: 남은 재료 보기·급구매 (이야기 쪽지가 먼저)
    else trash();
  } else if (t.kind === 'serve') {
    const c = custById(t.cid);
    if (c && c.seat >= 0) { const s = SEATS[c.seat]; p.dir = Math.abs(s.x - p.x) > Math.abs(s.y - p.y) ? (s.x > p.x ? 0 : 2) : (s.y > p.y ? 3 : 1); }
    serveTo(t.cid);
  } else if (t.kind === 'register') { p.dir = 3; handTakeout(); } // 포장 주문은 계산대에 올려 둬요
  if (t.kind !== 'register') p.target = null;
}

// 계산대 뒤에 서 있으면 맨 앞 손님부터 계산해요
function atRegister(p) {
  return !p.moving && p.target && p.target.kind === 'register' && has(REGISTER.stand, Math.round(p.x), Math.round(p.y));
}

function updatePlayer(dt) {
  const r = G.run, p = r.player;
  if (r.cook) return; // 조리 중에는 서 있어요 (미니게임은 tickCook이 실제 시간으로 돌려요)
  const wasMoving = p.path.length > 0;
  const arrived = walk(p, dt);
  if (arrived && wasMoving) arriveAt(p);
  if (atRegister(p)) {
    p.dir = 3;
    const c = custById(r.payLine[0]);
    if (c && c.state === 'payLine' && !c.moving) {
      p.payT += dt;
      if (p.payT >= PAY_STEP_SEC) { p.payT = 0; pay(c); }
    } else p.payT = 0;
  }
}
// ── js/sim/loop.js ──
// 한 틱: 영업 중이면 시계·손님·사장을 차례로 움직여요. 빠르게 감기도 작은 걸음으로 나눠서 같은 결과가 나와요.

const STEP = 1 / 30;
let acc = 0;

function stepSim(realDt) {
  if (G.phase !== 'day' || !G.run || G.run.paused) { acc = 0; return; }
  tickCook(Math.min(realDt, 0.1)); // 미니게임은 빨리감기해도 실제 속도 그대로
  if (G.run.dawn) { acc = 0; return; } // 새벽(문 열기 전)에는 가게 시계가 멈춰요
  acc += Math.min(realDt, 0.25) * G.run.speed;
  while (acc >= STEP && G.run && G.phase === 'day') {
    acc -= STEP;
    updatePlayer(STEP);
    updateCustomers(STEP);
    tickDay(STEP);
  }
}

// 시험용: 정해진 시간만큼 바로 돌려요 (화면 없이)
function runFor(sec) {
  let t = 0;
  while (t < sec && G.run && G.phase === 'day') {
    tickCook(STEP);
    if (!G.run.dawn) { updatePlayer(STEP); updateCustomers(STEP); tickDay(STEP); }
    t += STEP;
  }
}
// ── js/sim/dev.js ──
// 개발자 모드: 원하는 날·장면으로 바로 가기 (처음 화면 「개발자 모드」). 퀘스트·메뉴·도구를 그 시점에 맞춰 채워요.
// 화면은 만지지 않아요 — 준비 화면으로 가는 건 ui가 setPhase로.
