  });
  for (const q of S.done) S.prog[q] = 99;
  for (const m of S.menus) G.prep[m] = G.prep[m] || PREP_FIRST_DAY[m];
  if (J.ch >= 1) G.cash = START_CASH;
});
// 영업 중: 돌발 이벤트 바로 일으키기 · 돈 더하기
defineCmd('devIncident', ({ id }) => { forceIncident(id); emit('toast', '개발자: 돌발 이벤트를 일으켰습니다', 'info'); });
defineCmd('devCash', () => { G.cash += 1000000; emit('toast', '개발자: 100만 원을 더했습니다', 'info'); emit('prep'); });
// ── js/render/view.js ──
// 가게 그리기: 캔버스 1픽셀 = 그림 1픽셀, 화면에서는 정수 배로 키워요(픽셀이 뭉개지지 않게).

const VW = W * TILE;
const VH = H * TILE;
let cv, ctx, atlas, scale = 3, ready = false;
let t = 0; // 그리기용 시계 (초)
const marks = []; // 누른 자리 표시

function initView(canvas) {
  cv = canvas; ctx = cv.getContext('2d');
  cv.width = VW; cv.height = VH;
  atlas = new Image();
  atlas.onload = () => { ready = true; };
  atlas.src = ATLAS_URL;
}
const viewReady = () => ready;

// 화면 크기에 맞춰 배율 정하기: 그림 1픽셀이 기기 화면 픽셀 정수 개가 되게 (휴대폰에서도 또렷하게)
function fitView(availW, availH) {
  const dpr = window.devicePixelRatio || 1;
  const dev = Math.floor(Math.min(availW / VW, availH / VH) * dpr);
  scale = Math.max(1, dev) / dpr;
  cv.style.width = VW * scale + 'px';
  cv.style.height = VH * scale + 'px';
  return scale;
}
const viewScale = () => scale;
// 칸 좌표 → 캔버스 요소 안의 CSS 픽셀 (떠오르는 글자 자리용)
const tileToCss = (x, y) => ({ x: (x + 0.5) * TILE * scale, y: (y + 0.5) * TILE * scale });
// 화면 누른 자리 → 칸 좌표 (소수점까지 — 사람 그림을 눌렀는지 보려고)
function cssToTile(px, py) { return { x: px / scale / TILE, y: py / scale / TILE }; }

function addMark(x, y, kind) { marks.push({ x, y, kind, t: 0 }); }

function spr(name, dx, dy, flip, sw, sh, sy0) {
  const r = SPR[name]; if (!r) return;
  const w = sw || r[2], h = sh || r[3], oy = sy0 || 0;
  if (flip) {
    ctx.save(); ctx.translate(Math.round(dx) + w, Math.round(dy)); ctx.scale(-1, 1);
    ctx.drawImage(atlas, r[0], r[1] + oy, w, h, 0, 0, w, h); ctx.restore();
  } else ctx.drawImage(atlas, r[0], r[1] + oy, w, h, Math.round(dx), Math.round(dy), w, h);
}
// 바닥 무늬를 칸마다 깔아요
function tileFill(name, x0, y0, x1, y1) {
  const r = SPR[name];
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const sx = (x * TILE) % r[2], sy = (y * TILE) % r[3];
    ctx.drawImage(atlas, r[0] + sx, r[1] + sy, TILE, TILE, x * TILE, y * TILE, TILE, TILE);
  }
}

// 캐릭터: 한 장에 16×32 그림이 줄마다 — 0 서 있기 4장 · 1 숨쉬기 24장 · 2 걷기 24장 · 3 앉기 12장
function drawChar(ch, x, y, dir, mode, phase) {
  const r = SPR['char' + ch]; if (!r) return;
  let row, f;
  // 앉기: 0~5 오른쪽 · 6~11 왼쪽 보기. 고개를 돌리는 프레임은 빼고 첫 장(먹을 때만 두 장을 번갈아)을 써요
  if (mode === 'sit' || mode === 'sitEat') { row = 3; f = (dir === 2 ? 6 : 0) + (mode === 'sitEat' ? Math.floor(phase * 2) % 2 : 0); }
  else if (mode === 'walk') { row = 2; f = dir * 6 + Math.floor(phase * 10) % 6; }
  else { row = 1; f = dir * 6 + Math.floor(phase * 6) % 6; }
  const sit = mode === 'sit' || mode === 'sitEat';
  const dx = Math.round(x * TILE) + (sit ? (dir === 2 ? -SIT_SHIFT : SIT_SHIFT) : 0), dy = Math.round(y * TILE - 16 - (sit ? SIT_LIFT : 0));
  ctx.drawImage(atlas, r[0] + f * 16, r[1] + row * 32, 16, 32, dx, dy, 16, 32);
}

function bubble(x, y, w, h) {
  ctx.fillStyle = '#fffaf0';
  ctx.fillRect(x + 1, y, w - 2, h); ctx.fillRect(x, y + 1, w, h - 2);
  ctx.fillStyle = 'rgba(59,42,32,.35)'; ctx.fillRect(x + 1, y + h, w - 2, 1);
  ctx.fillStyle = '#fffaf0'; ctx.fillRect(x + Math.floor(w / 2) - 1, y + h, 2, 2);
}
// 그림을 담은 말풍선: 그림 크기에 맞춰 만들고 그림은 정가운데에 (cx: 가운데 x, bottom: 꼬리 위 y)
function iconBubble(name, cx, bottom) {
  const r = SPR[name], w = r[2] + 4, h = r[3] + 4;
  const x = Math.round(cx - w / 2), y = Math.round(bottom - h);
  bubble(x, y, w, h);
  spr(name, x + 2, y + 2);
  return { x, y, w, h };
}
// 그림을 (cx, cy) 가운데에 맞춰 그려요
function sprC(name, cx, cy) { const r = SPR[name]; spr(name, Math.round(cx - r[2] / 2), Math.round(cy - r[3] / 2)); }
function bar(x, y, w, frac, col) {
  ctx.fillStyle = 'rgba(40,28,20,.6)'; ctx.fillRect(x, y, w, 3);
  ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, Math.max(0, Math.round((w - 2) * frac)), 1);
}
const patCol = f => f > 0.5 ? '#7cc95a' : f > 0.25 ? '#f2b134' : '#e0533a';

// 시간에 따라 빛깔: 아침은 맑게, 저녁은 노을, 마감 뒤는 푸른 밤
function tint(min) {
  const h = 9 + min / 60;
  let c = null;
  if (h < 10) c = [255, 230, 180, 0.10 * (10 - h)];
  else if (h >= 17 && h < 20) c = [255, 140, 60, 0.16 * (h - 17) / 3];
  else if (h >= 20) c = [40, 50, 110, Math.min(0.32, 0.16 + 0.16 * (h - 20))];
  if (!c) return;
  ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${c[3]})`;
  ctx.fillRect(0, 0, VW, VH);
}

function drawRoom() {
  // 뒷벽(0~1줄), 주방 바닥(2~3줄), 홀(4줄~앞벽 위), 앞벽, 보도
  for (let x = 0; x < W; x += 3) spr('wall', x * TILE, 0, false, Math.min(48, (W - x) * TILE), 32);
  tileFill('floor_kitchen', 0, 2, W, 4);
  tileFill('floor_dining', 0, 4, W, FRONT_Y);
  tileFill('sidewalk', 0, FRONT_Y, W, H);
  // 앞벽: 낮은 벽(유리창 대신) — 문 칸만 비워요
  for (let x = 0; x < W; x++) {
    if (x === DOOR.x) continue;
    spr('wall_front', x * TILE, FRONT_Y * TILE, false, 16, 16, 16);
  }
  spr('doormat', DOOR.x * TILE, FRONT_Y * TILE);
  // 주방과 홀 사이 얇은 그림자
  ctx.fillStyle = 'rgba(40,28,20,.18)'; ctx.fillRect(0, 4 * TILE, VW, 1);
}

function stationHint() {
  if (!G.run) return;
  for (const id in STATIONS) {
    const st = STATIONS[id]; if (!st.menu) continue;
    const need = ticketsCount(st.menu) - handsCount(st.menu);
    if (need <= 0) continue;
    const [x, y] = st.tiles[0];
    const bob = Math.round(Math.sin(t * 5) * 1.5);
    const bx = x * TILE + (st.tiles.length > 2 ? 8 : 0), by = y * TILE - 14 + bob;
    const b = iconBubble(st.menu, bx + 8, by + 14);
    if (need > 1) { ctx.fillStyle = '#e0533a'; ctx.fillRect(b.x + b.w - 5, b.y - 2, 6, 6); ctx.fillStyle = '#fff'; digit(need, b.x + b.w - 3, b.y - 1); }
  }
}
// 아주 작은 숫자 (3×4 픽셀)
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001001001', '111101111101111', '111101111001111'];
function digit(n, x, y) {
  const s = DIG[Math.min(9, n)];
  for (let i = 0; i < 15; i++) if (s[i] === '1') ctx.fillRect(x + (i % 3), y + Math.floor(i / 3), 1, 1);
}

// 자기 자리에 도착해 앉아 있는지 (걸어가는 중이면 서 있는 그림)
const sittingNow = c => isSeated(c) && !c.moving && c.x === SEATS[c.seat].x && c.y === SEATS[c.seat].y;
const SIT_LIFT = 16; // 앉은 그림을 위로 올리는 픽셀: 엉덩이가 의자 방석 위에 오게 (발은 탁자 뒤로 숨어요 — drawFrame 그리는 순서)
const SIT_SHIFT = 3; // 탁자 쪽으로 당기는 픽셀: 등받이가 등 뒤로 보이게
function drawCustomerUI(c) {
  const px = Math.round(c.x * TILE), top = Math.round(c.y * TILE - 9 - (sittingNow(c) ? SIT_LIFT : 0)); // 머리 바로 위
  if (c.faceT > 0 && c.face) { spr('face_' + c.face, px + 3, top - 10); return; }
  if (c.state === 'reading') {
    bubble(px + 2, top - 8, 12, 7);
    ctx.fillStyle = '#3b2a20';
    for (let i = 0; i < 3; i++) if (Math.floor(t * 3) % 4 > i) ctx.fillRect(px + 4 + i * 3, top - 5, 2, 2);
  } else if (c.state === 'waitFood') {
    iconBubble(c.menu, px + 8, top - 2);
    bar(px, top - 1, 16, c.patience / c.patMax, patCol(c.patience / c.patMax));
  } else if (c.state === 'queue' || (c.state === 'payLine' && G.run.payLine[0] === c.id && !c.moving)) {
    if (c.state === 'payLine') { bubble(px + 3, top - 9, 10, 8); ctx.fillStyle = '#f2b134'; ctx.fillRect(px + 6, top - 7, 4, 4); ctx.fillStyle = '#c4861c'; ctx.fillRect(px + 7, top - 6, 2, 2); }
    bar(px, top, 16, c.patience / c.patMax, patCol(c.patience / c.patMax));
  }
}

// 이야기로 생긴 장식: 칸 가운데, 발이 칸 아래쪽에 닿게
const decorNow = () => (G.story ? G.story.decor : []).map(k => DECOR[k]).filter(Boolean);
function drawDecor(d) { const r = SPR[d.spr]; if (r) spr(d.spr, d.x * TILE + 8 - Math.floor(r[2] / 2), (d.y + 1) * TILE - r[3]); }
// 이야기 단서: 냉장고 뒤 쪽지 (찾을 때까지 「!」 말풍선이 통통)
function clueHint() {
  if (!questActive('c1_note')) return;
  const bob = Math.round(Math.sin(t * 5) * 1.5), x = 8, y = 4 + bob;
  bubble(x, y, 9, 12);
  ctx.fillStyle = '#e0533a'; ctx.fillRect(x + 4, y + 2, 2, 5); ctx.fillRect(x + 4, y + 8, 2, 2);
}

// 아직 안 연 메뉴의 조리대는 그리지 않아요 (이야기로 메뉴가 열리면 생겨요)
const visibleFurniture = () => FURNITURE.filter(f => !f.station || menuOpen(STATIONS[f.station].menu));

function drawFrame(dt) {
  if (!ready) return;
  t += dt;
  ctx.clearRect(0, 0, VW, VH);
  drawRoom();
  const r = G.run;
  // 뒤쪽 설비(벽에 붙은 것)
  const back = visibleFurniture().filter(f => f.y < 3 && !f.over);
  for (const f of back) spr(f.spr, f.x * TILE, f.y * TILE);
  for (const f of visibleFurniture().filter(f => f.y < 3 && f.over)) spr(f.spr, f.x * TILE, f.y * TILE);
  // 김이 나는 냄비
  if (r && r.cook) {
    const st = Object.values(STATIONS).find(s => s.menu === r.cook.menu);
    const [x, y] = st.tiles[0];
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i < 3; i++) {
      const k = (t * 1.5 + i / 3) % 1;
      ctx.fillRect(x * TILE + 4 + i * 4 + Math.round(Math.sin((t + i) * 6)), y * TILE + 2 - Math.round(k * 10), 2, 2);
    }
  }
  // 앞쪽: 탁자·의자·계산대·사람을 y순으로
  const items = [];
  for (const f of FURNITURE.filter(f => f.y >= 3)) items.push({ y: f.y + (f.over ? 1.3 : 1), d: () => spr(f.spr, f.x * TILE, f.y * TILE) });
  // 같은 줄은 의자(0.2) → 앉은 손님(0.3) → 탁자(0.375) 순서: 발이 탁자에 올라가 보이지 않게
  SEATS.forEach((s, i) => items.push({ y: s.y + 0.2, d: () => spr('chair', s.x * TILE, s.y * TILE - 16, s.face === 'left') }));
  for (const d of decorNow()) items.push({ y: d.y + 1, d: () => drawDecor(d) });
  if (r) {
    for (const c of r.customers) {
      const seated = sittingNow(c);
      if (seated) c.dir = SEATS[c.seat].face === 'right' ? 0 : 2;
      items.push({ y: c.y + (seated ? 0.3 : 0.6) + (c.lane || 0), d: () => drawChar(c.char, c.x, c.y + (c.lane || 0), c.dir, seated ? (c.state === 'eating' ? 'sitEat' : 'sit') : c.moving ? 'walk' : 'idle', t + c.id * 0.37) });
    }
    const p = r.player;
    items.push({ y: p.y + 0.6, d: () => drawChar(0, p.x, p.y, p.dir, p.moving ? 'walk' : 'idle', t) });
    // 탁자 위 음식
    SEATS.forEach((s, i) => {
      const c = r.seats[i] && r.customers.find(q => q.id === r.seats[i]);
      const tb = TABLES.find(q => q.no === s.table);
      if (c && c.state === 'eating') {
        // 탁자 위 작은 음식: 왼쪽 자리 손님 몫은 탁자 왼쪽, 오른쪽 자리 몫은 오른쪽에
        const sm = c.menu + '_s', sw = SPR[sm][2];
        const dx = s.face === 'right' ? tb.x * TILE + 1 : (tb.x + tb.w) * TILE - 1 - sw;
        items.push({ y: s.y + 1.05, d: () => spr(sm, dx, s.y * TILE - TABLE_LIFT + 2) });
      }
    });
  }
  items.sort((a, b) => a.y - b.y).forEach(o => o.d());
  stationHint();
  clueHint();
  if (r) {
    for (const c of r.customers) drawCustomerUI(c);
    // 사장 손에 든 음식
    const p = r.player;
    r.hands.forEach((d, i) => sprC(d.menu, p.x * TILE + 8 + (r.hands.length > 1 ? (i ? 7 : -7) : 0), p.y * TILE - 22));
    tint(r.min);
  }
  // 누른 자리
  for (let i = marks.length - 1; i >= 0; i--) {
    const m = marks[i]; m.t += dt;
    if (m.t > 0.35) { marks.splice(i, 1); continue; }
    const k = m.t / 0.35, s = 4 + k * 6;
    ctx.strokeStyle = `rgba(255,250,240,${1 - k})`; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(m.x * TILE + 8 - s) + 0.5, Math.round(m.y * TILE + 8 - s) + 0.5, Math.round(s * 2), Math.round(s * 2));
  }
}

// 준비·정산 화면 뒤에 비치는 가게 (손님 없이)
function drawIdle(dt, night) {
  if (!ready) return;
  t += dt;
  ctx.clearRect(0, 0, VW, VH);
  drawRoom();
  for (const f of visibleFurniture().filter(f => !f.over)) spr(f.spr, f.x * TILE, f.y * TILE);
  SEATS.forEach(s => spr('chair', s.x * TILE, s.y * TILE - 16, s.face === 'left'));
  decorNow().forEach(drawDecor);
  for (const f of visibleFurniture().filter(f => f.over)) spr(f.spr, f.x * TILE, f.y * TILE);
  ctx.fillStyle = night ? 'rgba(30,36,90,.45)' : 'rgba(30,36,90,.3)';
  ctx.fillRect(0, 0, VW, VH);
}
// ── js/render/cut.js ──
// 연출 그리기: 따로 둔 캔버스(#cutCv)에 밤의 골목을 그려요. 움직임 상태는 ui/cutscene.js가 들고 와요.

const CUT_W = 128;  // 게임 화면보다 좁게 잘라 크게 보여요 (휴대폰에서 3배)
const CUT_H = 176;
const WORLD_W = 272, GROUND = 144, ROAD = 176;
const STORES = [['st_flower', 16], ['st_bunsik', 96], ['st_laundry', 176]];
const SHOP_X = 96, SHOP_TOP = GROUND - 118; // 오가네 분식 그림 왼쪽 위
const LAMP_X = 84; // data/cutscenes.js opening props의 가로등 x와 같게
let cutCanvas, cx, cutAtlas, cutStars = null;

function initCut(canvas) {
  cutCanvas = canvas; cx = cutCanvas.getContext('2d');
  cutCanvas.width = CUT_W; cutCanvas.height = CUT_H;
  cutAtlas = new Image(); cutAtlas.src = ATLAS_URL;
}
// 그림 1픽셀이 기기 화면 픽셀 정수 개가 되게 키워요 (render/view.js fitView와 같은 방법)
function fitCut(availW, availH) {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.max(1, Math.floor(Math.min(availW / CUT_W, availH / CUT_H) * dpr)) / dpr;
  cutCanvas.style.width = CUT_W * s + 'px'; cutCanvas.style.height = CUT_H * s + 'px';
}

function cspr(name, x, y, flip) {
  const r = SPR[name]; if (!r) return;
  if (flip) { cx.save(); cx.translate(Math.round(x) + r[2], Math.round(y)); cx.scale(-1, 1); cx.drawImage(cutAtlas, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]); cx.restore(); }
  else cx.drawImage(cutAtlas, r[0], r[1], r[2], r[3], Math.round(x), Math.round(y), r[2], r[3]);
}
// 사람: x 가운데 · y 발끝. 줄 1 숨쉬기 · 2 걷기 · 3 앉기(0 오른쪽 · 6 왼쪽)
function person(a, t) {
  const r = SPR['char' + a.char]; if (!r) return;
  let row, f, lift = 0;
  if (a.pose === 'sit' && !a.moving) { row = 3; f = a.dir === 2 ? 6 : 0; lift = 6; }
  else if (a.moving) { row = 2; f = a.dir * 6 + Math.floor(t * 10) % 6; }
  else { row = 1; f = a.dir * 6 + Math.floor(t * 6) % 6; }
  if (a.stool) cspr('stool', a.x - 6, a.y - 13);
  cx.drawImage(cutAtlas, r[0] + f * 16, r[1] + row * 32, 16, 32, Math.round(a.x - 8), Math.round(a.y - 32 - lift), 16, 32);
  if (a.carry) cspr(a.carry, a.x + (a.dir === 2 ? -11 : 2), a.y - 13);
}

function cbubble(x, y, w, h) {
  cx.fillStyle = '#fffaf0';
  cx.fillRect(x + 1, y, w - 2, h); cx.fillRect(x, y + 1, w, h - 2);
  cx.fillRect(x + Math.floor(w / 2) - 1, y + h, 2, 2);
}
// 머리 위 감정 표시
function emote(a, kind, k) {
  const pose = a.pose === 'sit' && !a.moving ? 6 : 0;
  const x = Math.round(a.x - 5), y = Math.round(a.y - 46 - pose - (k < 0.15 ? (0.15 - k) * 20 : 0));
  if (kind === 'sweat') { // 머리 옆 땀방울 (흘러내려요)
    const hx = Math.round(a.x + 6), hy = Math.round(a.y - 28 - pose + Math.min(3, k * 4));
    cx.fillStyle = '#c9ecff'; cx.fillRect(hx + 1, hy, 1, 1); cx.fillRect(hx, hy + 1, 3, 3);
    cx.fillStyle = '#5a8fd0'; cx.fillRect(hx, hy + 4, 3, 1); cx.fillStyle = '#ffffff'; cx.fillRect(hx, hy + 1, 1, 1);
    return;
  }
  cbubble(x, y, 11, 10);
  if (kind === '!') { cx.fillStyle = '#e0533a'; cx.fillRect(x + 5, y + 2, 2, 4); cx.fillRect(x + 5, y + 7, 2, 1); }
  else if (kind === '…') { cx.fillStyle = '#3b2a20'; for (let i = 0; i < 3; i++) if (k * 4 > i) cx.fillRect(x + 2 + i * 3, y + 5, 2, 2); }
  else if (kind === 'heart') { cx.fillStyle = '#e0533a'; cx.fillRect(x + 3, y + 3, 2, 2); cx.fillRect(x + 6, y + 3, 2, 2); cx.fillRect(x + 3, y + 4, 5, 2); cx.fillRect(x + 4, y + 6, 3, 1); cx.fillRect(x + 5, y + 7, 1, 1); }
}

function sky(t, night) {
  if (!night) { // 낮: 맑은 하늘 + 구름 두 점
    const g = cx.createLinearGradient(0, -220, 0, GROUND);
    g.addColorStop(0, '#5aa6e8'); g.addColorStop(1, '#bfe3f7');
    cx.fillStyle = g; cx.fillRect(0, -220, WORLD_W, GROUND + 220);
    cx.fillStyle = '#ffffff';
    for (const [x, y] of [[58, 6], [176, -4]]) { const dx = Math.round(x + (t * 2) % 40); cx.fillRect(dx, y, 22, 5); cx.fillRect(dx + 5, y - 3, 12, 3); }
    return;
  }
  const g = cx.createLinearGradient(0, -220, 0, GROUND);
  g.addColorStop(0, '#0b0e24'); g.addColorStop(0.65, '#1d2340'); g.addColorStop(1, '#3a3160');
  cx.fillStyle = g; cx.fillRect(0, -220, WORLD_W, GROUND + 220);
  if (!cutStars) cutStars = Array.from({ length: 46 }, () => ({ x: Math.floor(fxRand() * WORLD_W), y: Math.floor(-210 + fxRand() * 230), p: fxRand() * 6 }));
  for (const s of cutStars) { cx.fillStyle = Math.sin(t * 2 + s.p) > 0.6 ? '#fffbe0' : '#8f93c0'; cx.fillRect(s.x, s.y, 1, 1); }
  // 달
  cx.fillStyle = '#fff3c4'; cx.beginPath(); cx.arc(214, -96, 9, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#e8d9a0'; cx.fillRect(210, -99, 3, 2); cx.fillRect(217, -93, 2, 2);
}

function ground() {
  const r = SPR.pave;
  for (let x = 0; x < WORLD_W; x += r[2]) cx.drawImage(cutAtlas, r[0], r[1], r[2], r[3], x, GROUND, r[2], r[3]);
  cx.fillStyle = '#5c5a6a'; cx.fillRect(0, ROAD, WORLD_W, 2);
  cx.fillStyle = '#34333f'; cx.fillRect(0, ROAD + 2, WORLD_W, 40);
  cx.fillStyle = '#c9b88e'; for (let x = 4; x < WORLD_W; x += 20) cx.fillRect(x, ROAD + 17, 10, 2);
}

// 따뜻한 불빛 (밤빛을 덮은 뒤에 더해요)
function glow(x, y, w, h, a) {
  cx.fillStyle = `rgba(255,214,130,${a})`;
  cx.fillRect(x, y, w, h);
}

// S: { cam, actors, props, door, fade, emotes, time }
function drawCut(S) {
  if (!cx || !cutAtlas.complete) return;
  const t = S.time;
  cx.clearRect(0, 0, CUT_W, CUT_H);
  cx.save();
  cx.translate(-Math.round(S.cam.x), -Math.round(S.cam.y));
  sky(t, S.night);
  for (const [n, x] of STORES) cspr(n, x, SHOP_TOP);
  cspr('sign', SHOP_X + 9, SHOP_TOP + 68);
  ground();
  // 물건·사람을 발끝 순서로
  const items = S.props.map(p => ({ y: p.y, d: () => cspr(p.spr, p.x, p.y - SPR[p.spr][3]) }));
  for (const id in S.actors) { const a = S.actors[id]; if (!a.hidden) items.push({ y: a.y, d: () => person(a, t + a.char) }); }
  items.sort((a, b) => a.y - b.y).forEach(o => o.d());
  if (!S.night) { // 낮: 문이 열리면 안쪽이 살짝 어둡게
    if (S.door) { cx.fillStyle = 'rgba(40,28,20,.45)'; cx.fillRect(SHOP_X + 18, SHOP_TOP + 92, 12, 23); }
  } else nightLights(S, t);
  // 감정 표시 (밝게)
  for (const id in S.emotes) { const e = S.emotes[id], a = S.actors[id]; if (a && !a.hidden) emote(a, e.kind, e.t); }
  cx.restore();
  if (S.fade > 0) { cx.fillStyle = `rgba(8,8,16,${S.fade})`; cx.fillRect(0, 0, CUT_W, CUT_H); }
}

// 밤빛을 덮고 따뜻한 불빛: 가게 창 · 열린 문 · 간판 · 가로등
function nightLights(S, t) {
  cx.fillStyle = 'rgba(22,26,70,.42)'; cx.fillRect(0, -220, WORLD_W, 440);
  const fl = 0.9 + Math.sin(t * 9) * 0.05;
  glow(SHOP_X + 41, SHOP_TOP + 86, 31, 22, 0.32);
  if (S.door) { glow(SHOP_X + 18, SHOP_TOP + 92, 12, 23, 0.55); glow(SHOP_X + 12, GROUND, 24, 10, 0.18); }
  glow(SHOP_X + 2, SHOP_TOP + 66, 76, 2, 0.25);
  cx.fillStyle = `rgba(255,214,130,${0.10 * fl})`;
  for (let i = 0; i < 4; i++) { const w = 18 + i * 8; cx.fillRect(LAMP_X + 7 - w / 2, 150 + i * 6, w, 6); } // 가로등 불빛 웅덩이
  glow(LAMP_X + 3, 118, 8, 7, 0.45 * fl); // 가로등 머리
}
// ── js/ui/sfx.js ──
// 효과음: 파일 없이 짧은 소리를 만들어요. 첫 터치 뒤에만 소리가 나요(브라우저 규칙).
let ac = null, muted = false;
function unlockAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
}
function setMuted(m) { muted = m; }
const isMuted = () => muted;

function tone(freq, dur, type, vol, slide, delay) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(vol || 0.06, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

const SOUNDS = {
  coin: () => { tone(988, 0.07, 'square', 0.05); tone(1319, 0.14, 'square', 0.05, 0, 0.07); },
  serve: () => tone(660, 0.08, 'triangle', 0.08, 880),
  cookStart: () => tone(220, 0.12, 'sawtooth', 0.03, 330),
  cookDone: () => tone(523, 0.1, 'triangle', 0.07),
  perfect: () => { tone(784, 0.08, 'square', 0.05); tone(1047, 0.08, 'square', 0.05, 0, 0.08); tone(1568, 0.16, 'square', 0.05, 0, 0.16); },
  angry: () => tone(180, 0.18, 'sawtooth', 0.04, 120),
  trash: () => tone(300, 0.12, 'square', 0.04, 150),
  open: () => { tone(523, 0.1, 'triangle', 0.08); tone(659, 0.1, 'triangle', 0.08, 0, 0.1); tone(784, 0.2, 'triangle', 0.08, 0, 0.2); },
  tap: () => tone(1200, 0.03, 'square', 0.025),
  surprise: () => { tone(880, 0.06, 'square', 0.04); tone(1320, 0.12, 'square', 0.04, 0, 0.06); },
  page: () => tone(440, 0.06, 'triangle', 0.05, 520),
};
function playSfx(name) { const f = SOUNDS[name]; if (f) f(); }
// ── js/ui/icons.js ──
// 화면(HTML)에 쓰는 작은 그림: 아틀라스에서 잘라 그림 주소로 만들어 둬요.

const cache = {};
let img = null;
function loadIcons() {
  return new Promise(res => {
    img = new Image();
    img.onload = () => res(true);
    img.onerror = () => res(false);
    img.src = ATLAS_URL;
  });
}
// name: 아틀라스 그림 이름. 캐릭터는 'char3' → 정면 서 있는 그림
function iconURL(name) {
  if (cache[name]) return cache[name];
  const r = SPR[name];
  if (!r || !img) return '';
  const isChar = name.startsWith('char');
  const w = isChar ? 16 : r[2], h = isChar ? 32 : r[3], sx = isChar ? r[0] + 48 : r[0];
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, sx, r[1], w, h, 0, 0, w, h);
  return (cache[name] = c.toDataURL());
}
const icon = (name, cls) => `<img class="px ${cls || ''}" src="${iconURL(name)}" alt="">`;
// ── js/ui/hud.js ──
// 영업 중 화면 위아래 막대: 날짜·시계·잔고·별점 / 주문표 / 손에 든 것·남은 재료·속도

const last = {};
function setText(id, v) { if (last[id] !== v) { last[id] = v; $(id).textContent = v; } }
function setHTML(id, v) { if (last['h' + id] !== v) { last['h' + id] = v; $(id).innerHTML = v; } }

const dayLabel = d => `${d}일차 · ${WEEKDAYS[(d - 1) % 7]}요일`;

function updateHud() {
  setText('hDay', dayLabel(G.day || 1));
  setText('hCash', wonShort(G.cash || 0));
  const alba = !!G.story && G.story.ch === 0; // 프롤로그: 아직 알바라 가게 돈은 오 사장님 것
  if (last.alba !== alba) { last.alba = alba; $('hCash').parentElement.hidden = alba; }
  setText('hStar', (G.rating || 3).toFixed(1));
  const r = G.run;
  if (!r) return;
  setText('hClock', r.dawn ? '06:00' : clockText(Math.min(r.min, 720)));
  // 주문표: 들어온 순서대로 (손에 이미 든 몫은 흐리게)
  const handLeft = {};
  for (const d of r.hands) handLeft[d.menu] = (handLeft[d.menu] || 0) + 1;
  const tk = r.tickets.slice(0, 7).map(t => {
    const c = r.customers.find(q => q.id === t.cid);
    const f = c ? c.patience / c.patMax : 1;
    const ready = handLeft[t.menu] > 0 && (handLeft[t.menu]--, true);
    return `<div class="tk${ready ? ' ready' : ''}${f < 0.25 ? ' late' : ''}">${icon(t.menu)}<b>${t.table ? t.table + '번' : '포장'}</b><i style="width:${Math.round(f * 10) * 10}%"></i></div>`;
  }).join('') + (r.tickets.length > 7 ? `<div class="tk more">+${r.tickets.length - 7}</div>` : '');
  setHTML('tickets', tk || '<div class="tk-empty">주문이 들어오면 여기에 쌓입니다</div>');
  // 손
  const hands = Array.from({ length: handsMax() }, (_, i) => i).map(i => { // 서빙 쟁반이 있으면 3칸
    const d = r.hands[i];
    return `<div class="hand${d ? ' q' + d.q : ''}">${d ? icon(d.menu) : ''}</div>`;
  }).join('');
  setHTML('hands', hands);
  // 남은 재료
  setHTML('stockMini', MENU_IDS.filter(m => menuOpen(m)).map(m => {
    const inc = r.rush.filter(o => o.menu === m).reduce((s, o) => s + o.n, 0);
    return `<span class="${r.stock[m] <= 0 ? 'out' : r.stock[m] <= 3 ? 'low' : ''}">${icon(m)}${r.stock[m] <= 0 ? '품절' : r.stock[m]}${inc ? `<i class="inc">+${inc}</i>` : ''}${r.ready && r.ready[m] && r.ready[m].length ? `<i class="ready" title="미리 끓여 둔 그릇">${r.ready[m].length}</i>` : ''}</span>`;
  }).join(''));
  setText('bSpeed', r.speed + '×');
  // 조리 미니게임
  const c = r.cook;
  if (c) {
    const g = cookRule(c.game);
    if (c.game === 'roll') {
      $('cookFill').style.width = (c.pos * 100).toFixed(1) + '%';
      $('cookNeedle').style.left = (100 - Math.min(1, c.t / g.timeout) * 100).toFixed(1) + '%';
      setText('cookName', `${MENUS[c.menu].name} ${g.name} ${c.taps}/${g.taps}`);
    } else $('cookNeedle').style.left = (c.pos * 100).toFixed(1) + '%';
  }
}

// 조리를 시작할 때 미니게임 막대를 그 메뉴에 맞게 바꿔요 (구간은 data/menu.js COOK_GAMES · 주방 타이머는 data/tools.js COOK_EASE)

// 이야기 화면: 대화 창 · 골목 신문 · 가게 이름 짓기 · 퀘스트 카드(준비 화면) · 퀘스트 표시(영업 중 왼쪽 위)

let open = null; // 보고 있는 장면 { id, i: 몇 번째 줄 }
const fill = s => s.replace(/\{shop\}/g, G.shop);

// 보여 줄 장면이 있으면 하나 열어요 (준비 화면에서, 또는 「바로」 장면이면 영업 중에도)
function showNextScene() {
  if (open || !G.story || G.phase === 'title') return;
  const id = G.story.queue[0];
  const sc = id && SCENES[id];
  if (!sc || (sc.when !== 'now' && G.phase !== 'prep')) return;
  if (G.phase === 'day') runCmd('hold', { on: true });
  open = { id, i: 0 };
  // 연출이 붙은 장면은 연출을 먼저 보고, 남은 줄을 이어서 보여 줘요
  if (sc.cut) { playCut(sc.cut, () => { runCmd('sceneOpen'); $('talk').hidden = false; drawScene(); }); return; }
  runCmd('sceneOpen');
  $('talk').hidden = false;
  drawScene();
  playSfx('page');
}

// 대화 한 줄 (연출 중에도 같은 모양)
function lineHTML(who, text) {
  const p = who && CAST[who];
  return `<div class="tk-box">${p ? face(who, 'tk-face') : ''}<div class="tk-body">${p ? `<b class="tk-name">${p.name}</b>` : ''}<p>${fill(text)}</p><i class="tk-next">▼</i></div></div>`;
}

// 준비 화면의 한 곳을 가리켜요 (오 사장님이 짚어 주는 줄)
function guide(key) {
  document.querySelectorAll('.guide-on').forEach(e => e.classList.remove('guide-on'));
  $('screen').classList.toggle('guiding', !!key);
  const el = key && document.querySelector(`[data-guide="${key}"]`);
  if (el) { el.classList.add('guide-on'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  return !!el;
}

function drawScene() {
  const sc = SCENES[open.id], box = $('talk');
  guide(null);
  if (sc.paper) { box.className = 'talk paper-mode'; box.innerHTML = paperHTML(sc); return; }
  if (open.i < sc.lines.length) {
    const [who, text, at] = sc.lines[open.i];
    box.className = 'talk' + (who ? (CAST[who].think ? ' think' : '') : ' narr') + (guide(at) ? ' guide' : '');
    box.innerHTML = lineHTML(who, text);
    return;
  }
  box.className = 'talk';
  box.innerHTML = `<div class="tk-box"><div class="tk-body"><b class="tk-name">새 간판</b><p>가게 이름을 지어 주세요</p>
    <div class="ask-row"><input id="talkName" maxlength="8" value="골목분식" autocomplete="off" aria-label="가게 이름"><button type="button" class="btn primary" data-talk="name">간판 걸기</button></div></div></div>`;
}

function paperHTML(sc) {
  const P = sc.paper;
  return `<div class="np">

function finish(name) {
  open = null;
  guide(null);

  runCmd('sceneDone', { name });
  if (G.phase === 'day') runCmd('hold', { on: false });
  updateQuestTrack();
  showNextScene();
}

function advance() {
  const sc = SCENES[open.id];
  if (sc.paper) { finish(); return; }
  if (open.i >= sc.lines.length) return; // 이름 짓는 중
  open.i++;
  playSfx('tap');
  if (open.i >= sc.lines.length && !sc.ask) finish(); else drawScene();
}

function initStory() {
  const box = $('talk');
  box.addEventListener('click', e => {
    if (cutWaiting()) { cutTap(); return; }
    if (!open || cutActive()) return;
    if (e.target.closest('[data-talk=name]')) { finish($('talkName').value); return; }
    if (e.target.closest('input')) return;
    advance();
  });
  box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'talkName') finish(e.target.value); });
  addEventListener('keydown', e => {
    if (cutWaiting() && (e.code === 'Space' || e.code === 'Enter')) { cutTap(); e.preventDefault(); return; }
    if (open && !cutActive() && !SCENES[open.id].ask && (e.code === 'Space' || e.code === 'Enter')) { advance(); e.preventDefault(); }
  });
}
const talking = () => !!open;

// 준비 화면: 지금 장과 할 일

// ── js/ui/cutscene.js ──
// 연출 진행: data/cutscenes.js의 차례(steps)를 하나씩 돌려요. 대화 줄은 #talk 창에, 그림은 render/cut.js가 #cutCv에.
// 화면만의 일이라 게임 규칙(G)은 바꾸지 않아요. 끝나면 done()을 불러요 (이야기 장면이 이어서 진행해요).

const WALK_PX = 34; // 걷는 빠르기 (연출 픽셀/초)
let C = null;

const cutActive = () => !!C;
const cutWaiting = () => !!(C && C.wait);

function initCutscene() {
  initCut($('cutCv'));
  $('cutSkip').addEventListener('click', e => { e.stopPropagation(); skipCut(); });
  addEventListener('resize', layoutCut);
}
// 아래 대화 창 자리를 남기고 크게
function layoutCut() { if (C) fitCut($('app').clientWidth, $('app').clientHeight - 190); }

function playCut(id, done) {
  const def = CUTS[id];
  C = {
    def, i: -1, t: 0, step: null, wait: false, time: 0, done,
    cam: { ...def.cam }, actors: JSON.parse(JSON.stringify(def.actors)), props: def.props.map(p => ({ ...p })),
    door: false, fade: 1, emotes: {}, night: !!def.night,
  };
  $('cut').hidden = false;
  layoutCut();
  next();
}

function caption(text, cls) {
  const el = $('cutCap');
  el.className = cls || '';
  el.innerHTML = text || '';
  el.hidden = !text;
}

function next() {
  C.i++; C.t = 0;
  const s = C.def.steps[C.i];
  C.step = s;
  if (!s) { end(); return; }
  const A = id => C.actors[id];
  if (s.caption !== undefined) caption(s.caption, 'cap');
  if (s.title !== undefined) caption(s.title ? `<small>${s.title[0]}</small><b>${s.title[1]}</b>` : '', 'cap title');
  if (s.door !== undefined) { C.door = s.door; playSfx('tap'); }
  if (s.night !== undefined) C.night = s.night;
  if (s.cam) C.cam = { x: s.cam[0], y: s.cam[1] };
  if (s.unprop) C.props = C.props.filter(p => p.spr !== s.unprop);
  if (s.show) A(s.show).hidden = false;
  if (s.hide) { A(s.hide).hidden = true; delete C.emotes[s.hide]; }
  if (s.stand) { const a = A(s.stand); a.pose = 'idle'; if (a.stool) { C.props.push({ spr: 'stool', x: a.x - 6, y: a.y - 1 }); a.stool = false; } a.y += 2; }
  if (s.carry) A(s.carry[0]).carry = s.carry[1];
  if (s.drop) { const a = A(s.drop); C.props.push({ spr: a.carry, x: a.x - 5, y: a.y + 1 }); a.carry = null; playSfx('trash'); }
  if (s.face) A(s.face[0]).dir = s.face[1];
  if (s.emote) { C.emotes[s.emote[0]] = { kind: s.emote[1], t: 0 }; if (s.emote[1] === '!') playSfx('surprise'); }
  if (s.pan) C.from = { ...C.cam };
  if (s.fade !== undefined) C.fadeFrom = C.fade;
  if (s.walk) { const a = A(s.walk[0]); a.to = [s.walk[1], s.walk[2]]; }
  if (s.say) {
    C.wait = true;
    const box = $('talk');
    box.className = 'talk in-cut' + (s.say[0] ? (CAST[s.say[0]].think ? ' think' : '') : ' narr');
    box.innerHTML = lineHTML(s.say[0], s.say[1]);
    box.hidden = false;
    return;
  }
  if (!s.sec && !s.walk) next(); // 바로 끝나는 차례
}

// 대화 창을 누르면 (ui/story.js가 불러요)
function cutTap() {
  if (!cutWaiting()) return;
  C.wait = false;
  $('talk').hidden = true; $('talk').innerHTML = '';
  playSfx('tap');
  next();
}

const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

// 매 프레임 (main.js)
function updateCut(dt) {
  if (!C) return;
  C.time += dt;
  for (const id in C.emotes) { const e = C.emotes[id]; e.t += dt; if (e.t > 1.6) delete C.emotes[id]; }
  const s = C.step;
  if (s && !C.wait) {
    C.t += dt;
    const k = s.sec ? Math.min(1, C.t / s.sec) : 1;
    if (s.pan) { const e = ease(k); C.cam.x = C.from.x + (s.pan[0] - C.from.x) * e; C.cam.y = C.from.y + (s.pan[1] - C.from.y) * e; }
    if (s.fade !== undefined) C.fade = C.fadeFrom + (s.fade - C.fadeFrom) * k;
    let walking = false;
    const a = s.walk && C.actors[s.walk[0]];
    if (a && a.to) {
      const [tx, ty] = a.to, dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy), st = WALK_PX * dt;
      if (d <= st) { a.x = tx; a.y = ty; a.moving = false; a.to = null; }
      else { a.x += dx / d * st; a.y += dy / d * st; a.moving = true; a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 3 : 1); walking = true; }
    }
    if (!walking && k >= 1) next(); // 걷기와 카메라가 같이 있으면 둘 다 끝나야
  }
  if (C) drawCut(C);
}

function end() {
  const done = C.done;
  C = null;
  caption('');
  $('cut').hidden = true;
  done();
}
function skipCut() {
  if (!C) return;
  $('talk').hidden = true; $('talk').innerHTML = '';
  end();
}

      </div>
      </details>
      <button class="btn primary big" data-act="afterReceipt">${G.day % 7 === 0 ? '주간 정산 보기' : '다음 날 준비'}</button>
    </div>`, 'scr-receipt');
  countUp(document.querySelector('.hero-num'));
}

// 큰 숫자를 0에서 세어 올려요 (끝나면 동전 소리)
function countUp(el) {
  if (!el) return;
  const to = +el.dataset.to, t0 = performance.now(), dur = 900;
  const tick = now => {
    if (!el.isConnected) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = won(Math.round(to * e / 100) * 100);
    if (k < 1) requestAnimationFrame(tick); else { el.textContent = won(to); playSfx('coin'); }
  };
  requestAnimationFrame(tick);
}

// ── 주간 정산 ──
function renderWeekly() {
  const W = G.lastWeekly;
  showScreen(`
    <div class="weekly">
      <div class="phase-tag night">일요일 밤</div>
      <h2>${W.week}주차 정산</h2>
      ${W.quests && W.quests.length ? `<div class="hls">${doneCard(W.quests)}</div>` : ''}
      <div class="paper">
        <div class="ln"><span>이번 주 매출</span><b>${won(W.sales)}</b></div>
        <div class="ln minus"><span>가게 임대료</span><b>−${won(W.rent)}</b></div>
        <div class="ln minus"><span>창업 대출 상환</span><b>−${won(W.loanPay)}</b></div>
        <div class="dash"></div>
        <div class="ln total"><span>잔고</span><b class="${G.cash < 0 ? 'neg' : ''}">${won(G.cash)}</b></div>
        <div class="ln note"><span>남은 대출</span><b>${won(W.loanLeft)}</b></div>
      </div>
      ${G.cash < 0 ? `<p class="warn">잔고가 모자랍니다. 다음 주에는 가격이나 주문량을 다시 살펴보세요. (프로토타입에서는 그대로 이어집니다)</p>` : ''}
      <button class="btn primary big" data-act="afterWeekly">다음 주 시작</button>
    </div>`, 'scr-weekly');
}

// ── 개발자 모드: 원하는 날·장면으로 바로 가기 (sim/dev.js DEV_JUMPS) ──
let devOn = false;
function renderDev() {
  devOn = true;
  showScreen(`
    <div class="devs">
      <h2>개발자 모드</h2>
      <p class="dev-note">고른 날의 준비 화면으로 바로 갑니다. 지금 세이브는 덮어씁니다. 영업 중 쉬기(❚❚)에서 돌발 이벤트를 바로 일으킬 수 있습니다.</p>
      ${DEV_JUMPS.map(j => `<button class="btn" data-act="devJump" data-j="${j.id}">${j.name}</button>`).join('')}
      <button class="btn ghost small" data-act="toTitle">처음 화면</button>
    </div>`, 'scr-dev');
}

// ── 엔딩 크레딧 ──
// 게임 엔딩(3년 기한)이 끝나면 올라가요. 엔딩이 생기기 전에는 처음 화면 「크레딧」 버튼으로 같은 화면을 봐요.
function renderCredits() {
  const blocks = CREDITS.map(c => `<div class="cr-block"><small>${c.head}</small>${c.lines.map((l, i) => i === 0 && c.link ? `<b><a href="${c.link}" target="_blank" rel="noopener">${l}</a></b>` : i === 0 ? `<b>${l}</b>` : `<span>${l}</span>`).join('')}</div>`).join('');
  showScreen(`
    <div class="credits-roll">
      <div class="cr-track">
        <h1 class="logo">소상공인<br>키우기</h1>
        ${blocks}
        <p class="cr-thanks">${CREDITS_THANKS}</p>
      </div>
      <button class="btn ghost small cr-close" data-act="toTitle">처음 화면</button>
    </div>`, 'scr-credits');
}

function renderPause() {
  showScreen(`
    <div class="pause">
      <h2>잠깐 쉬는 중</h2>
      <button class="btn primary big" data-act="resume">계속하기</button>
      ${G.run && !G.run.closing ? `<button class="btn" data-act="closeEarly">오늘 영업 일찍 마감하기</button><p class="pause-note">새 손님은 받지 않고, 안에 있는 손님만 마저 받습니다</p>` : ''}
      ${devOn && G.run && !G.run.closing ? `<div class="dev-inc"><small>개발자 · 돌발 이벤트 바로</small>${Object.keys(INCIDENTS).map(id => `<button class="btn small" data-act="devInc" data-i="${id}">${INCIDENTS[id].name}</button>`).join('')}<button class="btn small" data-act="devCash">+100만 원</button></div>` : ''}
      <button class="btn ghost" data-act="toTitle">처음 화면 (오늘 영업은 저장되지 않습니다)</button>
    </div>`, 'scr-pause');
}

// 화면 버튼 → 명령
function initScreens(onStart) {
  scr().addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    unlockAudio();
    const a = b.dataset.act, m = b.dataset.m, d = +b.dataset.d;
    if (a === 'new') { if (hasSave() && !confirmNew(b)) return; clearSave(); newGame(); playSfx('page'); onStart(); }
    else if (a === 'continue') { if (loadGame()) { playSfx('page'); onStart(); } }
    else if (a === 'price') { runCmd('setPrice', { menu: m, delta: d }); playSfx('tap'); }
    else if (a === 'prep') { runCmd('setPrep', { menu: m, delta: d }); playSfx('tap'); }
    else if (a === 'open') runCmd('openShop');
    else if (a === 'questPay') runCmd('questPay', { id: b.dataset.q });
    else if (a === 'buyTool') runCmd('buyTool', { id: b.dataset.tool });
    else if (a === 'afterReceipt') { playSfx('page'); runCmd('afterReceipt'); }
    else if (a === 'afterWeekly') { playSfx('page'); runCmd('afterWeekly'); }
    else if (a === 'credits') { playSfx('page'); renderCredits(); }
    else if (a === 'dev') { playSfx('page'); renderDev(); }
    else if (a === 'devJump') { clearSave(); runCmd('devJump', { id: b.dataset.j }); playSfx('page'); onStart(); }
    else if (a === 'devInc') { runCmd('pause', { on: false }); runCmd('devIncident', { id: b.dataset.i }); }
    else if (a === 'devCash') { runCmd('devCash'); }
    else if (a === 'resume') { runCmd('pause', { on: false }); }
    else if (a === 'closeEarly') { runCmd('pause', { on: false }); runCmd('closeEarly'); playSfx('page'); }
    else if (a === 'toTitle') { if (G.run) runCmd('pause', { on: false }); G.run = null; G.phase = 'title'; renderTitle(); }
  });
}
// 이어하기가 있을 때 새로 시작은 한 번 더 눌러야 해요 (창 띄우지 않고)
function confirmNew(b) {
  if (b.dataset.sure) return true;
  b.dataset.sure = '1'; b.textContent = '한 번 더 누르면 새로 시작합니다';
  return false;
}
// ── js/ui/feedback.js ──
// 규칙이 남긴 사건(emit)을 받아 화면·소리로 보여 줘요.

function toast(text, kind, who) {
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'info') + (who ? ' who' : '');
  if (who) el.innerHTML = `<span class="q-face">${icon('char' + CAST[who].char)}</span><span>${text}</span>`; // 이야기 인물이 하는 말
  else el.textContent = text;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.classList.add('out'), 2200);
  setTimeout(() => el.remove(), 2600);
}

function float(x, y, text, kind) {
  const p = tileToCss(x, y);
  const el = document.createElement('div');
  el.className = 'float ' + (kind || '');
  el.textContent = text;
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  $('floats').appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

// 말풍선: 사람 머리 위를 따라다녀요 (지나가는 사람의 한마디 등)
const speech = [];
function say(id, text) {
  const el = document.createElement('div');
  el.className = 'say';
  el.textContent = text;
  $('floats').appendChild(el);
  speech.push({ id, el, t: 0 });
}
function updateSpeech(dt) {
  for (let i = speech.length - 1; i >= 0; i--) {
    const s = speech[i]; s.t += dt;
    const c = G.run && G.run.customers.find(q => q.id === s.id);
    if (!c || s.t > 2.2) { s.el.remove(); speech.splice(i, 1); continue; }
    const p = tileToCss(c.x, c.y + (c.lane || 0) - 1.55);
    s.el.style.left = p.x + 'px'; s.el.style.top = p.y + 'px';
    s.el.style.opacity = s.t > 1.9 ? String((2.2 - s.t) / 0.3) : '1';
  }
}

// 첫날 길잡이: 처음 겪는 일마다 한 번씩만
const shown = new Set();
// oh: 프롤로그(알바 사흘) 동안은 오 사장님이 옆에서 말해 줘요
function hint(key, text, oh) {
  if (G.day > 2 || shown.has(key)) return;
  shown.add(key);
  if (oh && G.story && G.story.ch === 0) toast(oh, 'hint', 'oh');
  else toast(text, 'hint');
}

function initFeedback() {
  onEvent('toast', toast);
  onEvent('float', float);
  onEvent('say', say);
  onEvent('sfx', playSfx);
  onEvent('tapMark', (x, y) => { addMark(x, y); playSfx('tap'); });
  onEvent('cook', (on, menu, game) => {
    if (on) setupCook(menu, game);
    $('cookUI').hidden = !on;
    if (on && G.run && G.run.dawn) $('dawnUI').hidden = true; // 새벽에 끓이는 동안은 새벽 창을 잠깐 내려요
    if (!on) hint('serve', '음식을 든 채로 손님 자리를 눌러 보세요', '다 됐으면 손님 자리를 눌러서 갖다줘. 식기 전에!');
  });
  // 돌발 이벤트: 시작하면 알림 (오 사장님 미션은 얼굴과 함께), 진행은 위 막대 (ui/story.js)
  onEvent('incident', (what, x) => {
    if (what === 'start') { const D = incidentInfo(x); toast(D.text, 'event', D.who); }
    updateQuestTrack();
  });
  onEvent('dawn', (on, q) => {
    $('dawnUI').hidden = !on;
    if (on) renderDawn();
    if (q !== undefined) toast(q === 2 ? '완벽한 떡볶이를 보온 통에 담았습니다' : '떡볶이를 보온 통에 담았습니다', q === 2 ? 'good' : 'info');
  });
  onEvent('fridge', open => { if (open) $('rushUI').hidden = false; if (!$('rushUI').hidden) renderRush(); });
  onEvent('order', () => hint('order', '주문이 들어왔습니다! 말풍선이 뜬 조리대를 눌러 보세요', '주문 들어왔다! 말풍선 뜬 화구를 눌러.'));
  onEvent('phase', p => {
    if (p !== 'day') { $('cookUI').hidden = true; $('rushUI').hidden = true; $('dawnUI').hidden = true; $('toasts').innerHTML = ''; } // 영업 중 알림은 정산 화면으로 넘기지 않아요
    if (p === 'prep') { saveGame(); renderPrep(); showNextScene(); }
    else if (p === 'day') hideScreen();
    else if (p === 'receipt') renderReceipt();
    else if (p === 'weekly') renderWeekly();
    updateQuestTrack();
  });
  onEvent('prep', () => { saveGame(); renderPrep(); }); // 준비 화면에서 바뀐 것(이야기 장면·수리비 등)은 바로 저장
  onEvent('story', showNextScene);
  onEvent('quest', updateQuestTrack);
  onEvent('pause', on => { if (on) renderPause(); else if (G.phase === 'day') hideScreen(); });
  onEvent('closing', () => playSfx('page'));
}

// 계산 줄이 처음 생기면 알려 줘요 (main.js가 매 프레임 불러요)
function watchHints() {
  const r = G.run;
  if (r && r.payLine.length && !(r.player.target && r.player.target.kind === 'register')) hint('pay', '계산 줄이 생겼습니다. 계산대를 눌러 보세요', '계산 줄 섰다. 계산대 뒤에 서 있어야 계산이 돼.');
}
// ── js/ui/input.js ──
// 입력: 가게 화면 누르기 → 칸 명령 · 스페이스(조리 멈추기) · Esc(쉬기) · 아래 막대 버튼

const SPEEDS = [1, 2, 3];

function initInput() {
  const cv = $('cv');
  cv.addEventListener('pointerdown', e => {
    unlockAudio();
    if (G.phase !== 'day' || !G.run || G.run.paused) return;
    const rc = cv.getBoundingClientRect();
    const t = cssToTile(e.clientX - rc.left, e.clientY - rc.top);
    runCmd(G.run.cook ? 'cookTap' : 'tap', t);
    e.preventDefault();
  });
  // 조리 중에는 화면 어디를 눌러도 멈춰요
  $('cookUI').addEventListener('pointerdown', e => { runCmd('cookTap'); e.preventDefault(); });
  $('bPause').addEventListener('click', () => { if (G.run && !talking()) runCmd('pause', { on: !G.run.paused }); });
  $('bSpeed').addEventListener('click', () => {
    if (!G.run) return;
    runCmd('speed', { x: SPEEDS[(SPEEDS.indexOf(G.run.speed) + 1) % SPEEDS.length] });
  });
  addEventListener('keydown', e => {
    if (G.phase !== 'day' || !G.run || talking()) return;
    if (e.code === 'Space') { if (G.run.cook && !e.repeat) runCmd('cookTap'); e.preventDefault(); }
    else if (e.code === 'Escape') runCmd('pause', { on: !G.run.paused });
  });
  // 다른 창으로 가면 저절로 쉬어요
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.phase === 'day' && G.run && !G.run.paused && !talking()) runCmd('pause', { on: true });
  });
}
// ── js/main.js ──
// 시작점: 화면을 잇고, 매 프레임 규칙을 돌리고 그려요.

function layout() {
  const st = $('stage');
  fitView(st.clientWidth, st.clientHeight - 8);
}

let lastT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - (lastT || now)) / 1000);
  lastT = now;
  stepSim(dt);
  if (G.phase === 'day' && G.run) { drawFrame(dt); watchHints(); }
  else drawIdle(dt, G.phase === 'receipt' || G.phase === 'weekly');
  updateSpeech(dt);
  updateCut(dt);
  if (G.phase === 'day') updateQuestTrack(); // 돌발 이벤트 진행도 (바뀐 것만 다시 그려요)
  document.body.dataset.phase = G.phase;
  if (G.phase !== 'title') updateHud();
  if (G.run && !document.getElementById('rushUI').hidden && Math.floor(lastT / 500) !== Math.floor((lastT - dt * 1000) / 500)) renderRush(); // 도착까지 남은 초
  requestAnimationFrame(frame);
}

async function boot() {
  initView($('cv'));
  await loadIcons();
  initFeedback();
  initInput();
  initStory();
  initCutscene();
  initRush();
  initDawn();
  initScreens(() => setPhase('prep'));
  layout();
  addEventListener('resize', layout);
  renderTitle();
  requestAnimationFrame(frame);
  // 시험용 손잡이 (dev/qa 스크립트가 써요)
  window.__T = { G, runCmd, runFor, targetAt, viewReady };
}
boot();
})();
