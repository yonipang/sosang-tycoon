<title>소상공인 키우기</title>
<style>
/* @include font.css */
/* @include style.css */
</style>

<div id="app">
  <header id="hud">
    <div class="hud-row">
      <span id="hDay" class="pill">1일차</span>
      <span id="hClock" class="clock">09:00</span>
      <span class="pill cash"><b id="hCash">0</b></span>
      <span class="pill star">★ <b id="hStar">3.0</b></span>
      <button id="bSet" type="button" class="gear" aria-label="설정"><svg viewBox="0 0 12 12" width="20" height="20" shape-rendering="crispEdges" aria-hidden="true"><g fill="currentColor"><rect x="5" y="0" width="2" height="2"/><rect x="5" y="10" width="2" height="2"/><rect x="0" y="5" width="2" height="2"/><rect x="10" y="5" width="2" height="2"/><rect x="1" y="1" width="2" height="2"/><rect x="9" y="1" width="2" height="2"/><rect x="1" y="9" width="2" height="2"/><rect x="9" y="9" width="2" height="2"/><rect x="2" y="3" width="8" height="6"/><rect x="3" y="2" width="6" height="8"/></g><rect x="5" y="5" width="2" height="2" fill="var(--paper)"/></svg></button>
    </div>
    <div class="hud-row2">
      <div id="tickets" aria-label="주문표"></div>
      <div id="questTrack" hidden aria-label="할 일"></div>
      <div id="exHud" hidden aria-label="체력 · 가방"></div>
    </div>
  </header>
  <main id="stage">
    <div id="cvWrap">
      <canvas id="cv" aria-label="가게 화면 — 칸을 눌러 움직여요"></canvas>
      <div id="floats" aria-hidden="true"></div>
      <div id="tutBar" hidden aria-live="polite"></div>
      <div id="rushUI" hidden>
        <div class="rush-card">
          <div class="rush-head"><b>냉장고 · 남은 재료</b><button id="rushClose" type="button" class="sq" aria-label="닫기">✕</button></div>
          <div id="rushList"></div>
          <p class="rush-tip">영업 중에 사면 근처 마트에서 비싸게 사 와요. 조금 기다려야 도착합니다</p>
        </div>
      </div>
      <div id="dawnUI" hidden>
        <div class="dawn-card">
          <div class="dawn-head"><b>새벽 6:00 · 보온 통</b></div>
          <p class="dawn-tip">문 열기 전에 떡볶이를 미리 끓여 둘 수 있습니다. 미리 끓인 그릇은 화구를 누르면 바로 나갑니다.</p>
          <div id="dawnSlots"></div>
          <p class="dawn-note">팔지 못한 그릇은 마감 때 버립니다</p>
          <div class="dawn-btns"><button type="button" class="btn" data-dawn="cook">끓이기</button><button type="button" class="btn primary" data-dawn="open">문 열기 · 09:00</button></div>
        </div>
      </div>
      <div id="cookUI" hidden>
        <div class="cook-card">
          <div id="cookName" class="cook-name">만드는 중</div>
          <div class="cook-bar" id="cookBar"><i id="zoneGood"></i><i id="zonePerfect"></i><span id="cookFill"></span><b id="cookNeedle"></b></div>
          <div class="cook-tip" id="cookTip"></div>
        </div>
      </div>
    </div>
    <div id="town" hidden><div id="townBar"></div><canvas id="townCv" aria-label="골목 — 누른 채로 끌면 조이스틱, 짧게 누르면 그곳까지 걸어가요"></canvas><div id="townJoy" hidden aria-hidden="true"><i></i></div><button type="button" id="townTalk" hidden>대화하기</button><button type="button" id="townAct" disabled aria-label="상호작용">…</button><div id="townNav"></div><div id="townSheet" class="town-sheet" hidden></div><div id="townFade" hidden aria-hidden="true"></div></div>
  </main>
  <footer id="bar">
    <div class="hands-wrap"><small>손</small><div id="hands"></div></div>
    <div id="stockMini" aria-label="남은 재료"></div>
    <div class="ctl">
      <button id="bSpeed" type="button" class="sq" aria-label="빠르기">1×</button>
      <button id="bPause" type="button" class="sq" aria-label="쉬기" data-guide="pause">❚❚</button>
    </div>
  </footer>
  <div id="toasts" aria-live="polite"></div>
  <div id="guideDim" hidden aria-hidden="true"></div>
  <div id="qModal" class="modal" hidden></div>
  <div id="incUI" class="inc-ui" hidden></div>
  <div id="askModal" class="modal ask" hidden></div>
  <div id="revModal" class="modal ask" hidden></div>
  <section id="screen" hidden></section>
  <div id="cut" hidden><canvas id="cutCv" aria-label="연출"></canvas><div id="cutCap" hidden></div><button id="cutSkip" type="button">건너뛰기 ▶▶</button></div>
  <div id="talk" class="talk" hidden aria-live="polite"></div>
</div>
